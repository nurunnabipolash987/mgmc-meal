<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">
<meta name="theme-color" content="#6366f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Cdefs%3E%3ClinearGradient%20id='g'%20x1='0%25'%20y1='0%25'%20x2='100%25'%20y2='100%25'%3E%3Cstop%20offset='0%25'%20stop-color='%236366f1'/%3E%3Cstop%20offset='100%25'%20stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width='100'%20height='100'%20rx='22'%20fill='url(%23g)'/%3E%3Ctext%20x='50'%20y='55'%20font-size='62'%20text-anchor='middle'%20dominant-baseline='middle'%20font-family='Apple%20Color%20Emoji,Segoe%20UI%20Emoji,sans-serif'%3E%F0%9F%8D%BD%EF%B8%8F%3C/text%3E%3C/svg%3E">
<title>Meal</title>
<style>
:root{--font-sans:'Plus Jakarta Sans','Noto Sans Bengali',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;--font-num:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;--text:#0f172a;--muted:#64748b;--border:rgba(226,232,240,0.92);--primary:#6366f1;--primary-2:#4f46e5;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;--glass:rgba(255,255,255,0.82);--glass-border:rgba(255,255,255,0.88);--shadow-sm:0 10px 28px -12px rgba(15,23,42,0.14),inset 0 1px 0 rgba(255,255,255,0.9);--radius:20px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;scroll-behavior:smooth}
body{font-family:var(--font-sans);color:var(--text);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.55;font-variant-numeric:tabular-nums;background:radial-gradient(circle at 0% 0%,#e0e7ff 0%,transparent 55%),radial-gradient(circle at 100% 0%,#fce7f3 0%,transparent 50%),radial-gradient(circle at 100% 100%,#dbeafe 0%,transparent 55%),radial-gradient(circle at 0% 100%,#fef3c7 0%,transparent 55%),linear-gradient(135deg,#f5f7fb 0%,#eef2ff 100%);background-attachment:fixed;min-height:100vh}
button,input,select,textarea{font-family:inherit;font-size:15px}
.num-font,.th-number,.stat-num,.usc-count,.dli-num,.rs-num,.r-num,.phone-num,.cdb-day,.notif-badge{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.app-shell{min-height:100vh;display:flex;flex-direction:column}
.app-main{flex:1}
.app-footer{text-align:center;padding:22px 16px;color:var(--muted);font-size:12.5px;line-height:1.7;border-top:1px solid rgba(226,232,240,.65);background:rgba(255,255,255,.48);backdrop-filter:blur(12px);margin-top:32px}
.app-footer strong,.app-footer .dev-name{color:var(--primary);font-weight:700}
.auth-screen{min-height:100vh;display:flex;flex-direction:column;background:linear-gradient(135deg,#6366f1 0%,#8b5cf6 50%,#ec4899 100%)}
.auth-screen .app-footer{color:rgba(255,255,255,.88);border-top-color:rgba(255,255,255,.15);background:transparent;backdrop-filter:none;margin-top:0}
.auth-screen .app-footer strong,.auth-screen .app-footer .dev-name{color:#fff}
.auth-body{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.auth-wrap{width:100%;max-width:430px}
.brand{text-align:center;color:#fff;margin-bottom:18px}
.brand .logo{width:66px;height:66px;margin:0 auto;border-radius:20px;background:rgba(255,255,255,.22);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;font-size:32px;border:1.5px solid rgba(255,255,255,.38)}
.brand h1{font-size:22px;margin-top:14px;font-weight:800;letter-spacing:-0.3px}
.brand p{opacity:.92;font-size:14px;margin-top:4px}
.brand .version-tag{display:inline-block;margin-top:10px;padding:4px 12px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.5px;color:rgba(255,255,255,.92);background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);font-family:var(--font-num)}
.auth-bottom-note{text-align:center;margin-top:14px;font-size:12px;color:rgba(255,255,255,.82);font-weight:600}
.card{background:rgba(255,255,255,.95);backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.9);border-radius:22px;padding:24px 22px;box-shadow:0 32px 72px -20px rgba(15,23,42,.5)}
.tabs{display:flex;gap:6px;background:rgba(241,245,249,.9);padding:5px;border-radius:13px;margin-bottom:18px}
.tab{flex:1;border:none;background:transparent;padding:11px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:700;transition:.15s}
.tab.active{background:#fff;color:var(--primary-2);box-shadow:0 2px 8px rgba(0,0,0,.07)}
.view{display:none;flex-direction:column;gap:14px}
.view.active{display:flex}
label{display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:#334155;font-weight:600}
.input-wrap{position:relative;display:flex;align-items:center}
input,select,textarea{padding:13px 14px;border:1.5px solid var(--border);border-radius:13px;background:rgba(255,255,255,.97);outline:none;transition:.15s;color:var(--text);width:100%;font-size:15px}
.input-wrap input{padding-right:44px}
.pw-eye{position:absolute;right:8px;width:34px;height:34px;border:none;background:transparent;color:var(--muted);cursor:pointer;border-radius:8px;display:inline-flex;align-items:center;justify-content:center}
textarea{resize:vertical;min-height:90px}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(99,102,241,.13);background:#fff}
input[type=checkbox]{width:auto;padding:0}
.btn{border:none;padding:12px 20px;border-radius:13px;cursor:pointer;font-weight:700;transition:.16s;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;user-select:none;min-height:46px}
.btn:active{transform:scale(.98)}
.btn-primary{background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff;box-shadow:0 8px 18px -8px rgba(79,70,229,.65)}
.btn-primary:hover{background:linear-gradient(135deg,#4f46e5,#4338ca)}
.btn-success{background:linear-gradient(135deg,#10b981,#059669);color:#fff}
.btn-warning{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff}
.btn-danger{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff}
.btn-ghost{background:rgba(255,255,255,.8);color:#334155;border:1.5px solid var(--border)}
.btn-ghost:hover{color:var(--primary-2);border-color:#c7d2fe;background:#fff}
.btn-ghost.danger{color:#dc2626;border-color:#fecaca;background:rgba(255,241,242,.85)}
.btn-xl{padding:18px 24px;font-size:16.5px;border-radius:16px;width:100%;min-height:62px;font-weight:800}
.btn-block{width:100%}
.btn-sm{padding:8px 14px;min-height:36px;font-size:13.5px;border-radius:10px}
/* Topbar: Left (Icon + Bold App Name on line 1, Account Holder Bold Name | Normal Level on line 2), Right (Bell + 3 Bars) */
.topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:rgba(255,255,255,0.94);backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid rgba(226,232,240,0.85)}
.brand-col{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.brand-bar{display:flex;align-items:center;gap:9px;min-width:0}
.app-logo{width:34px;height:34px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;background:linear-gradient(135deg,#6366f1,#8b5cf6);box-shadow:0 6px 14px -6px rgba(99,102,241,.65);color:#fff;position:relative}
.app-logo::after{content:'';position:absolute;inset:2px;border-radius:8px;border:1.5px solid rgba(255,255,255,.38);pointer-events:none}
.app-title{font-family:var(--font-sans);font-size:16.5px;font-weight:800;letter-spacing:-0.3px;line-height:1.2;color:#0f172a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-subline{font-size:12.5px;line-height:1.3;color:#475569;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:2px}
.user-subline b{font-weight:700;color:#0f172a}
.user-subline .sep{color:#94a3b8;margin:0 6px;font-weight:400}
.user-subline .role-txt{font-weight:400;color:#4f46e5}
.top-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;position:relative}
.icon-btn{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--border);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;color:#0f172a;position:relative}
.icon-btn:hover{border-color:var(--primary);color:var(--primary);background:#f8faff}
.icon-btn svg{width:21px;height:21px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.notif-badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 4px 10px rgba(239,68,68,.45)}
.nav-dropdown{position:absolute;top:calc(100% + 10px);right:0;width:265px;background:rgba(255,255,255,0.98);backdrop-filter:blur(24px);border:1.5px solid rgba(226,232,240,0.95);border-radius:18px;box-shadow:0 24px 48px -12px rgba(15,23,42,0.25);padding:10px;display:none;flex-direction:column;gap:4px;z-index:200;animation:fadeIn .15s ease-out}
.nav-dropdown.open{display:flex}
.nd-user-card{padding:11px 12px;border-radius:13px;background:linear-gradient(135deg,#eef2ff,#f5f3ff);border:1px solid #c7d2fe;margin-bottom:4px}
.nd-user-name{font-weight:800;font-size:14.5px;color:#1e1b4b;display:flex;align-items:center;gap:6px}
.nd-user-role{font-size:11.5px;font-weight:600;color:#4f46e5;margin-top:3px;display:flex;align-items:center;gap:6px}
.sync-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#10b981}
.sync-dot.local{background:#6366f1}
.sync-dot.saving{background:#f59e0b;animation:pulse 1s infinite}
.nd-item{width:100%;border:none;background:transparent;padding:11px 12px;border-radius:11px;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;color:#1e293b;text-align:left;transition:.14s}
.nd-item:hover{background:#f1f5f9;color:var(--primary-2)}
.nd-item.danger{color:#dc2626;margin-top:4px;border-top:1px solid #f1f5f9;padding-top:12px}
.nd-item.danger:hover{background:#fef2f2}
.cal-svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;vertical-align:-3px}
.cal-dynamic-badge{width:40px;height:40px;border-radius:11px;overflow:hidden;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;border:1.5px solid #c7d2fe;flex-shrink:0}
.cal-dynamic-badge .cdb-top{width:100%;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-size:9px;font-weight:800;text-align:center;line-height:1.35;text-transform:uppercase;font-family:var(--font-num)}
.cal-dynamic-badge .cdb-day{font-size:14.5px;font-weight:800;color:#312e81;line-height:1.35}
.dash{max-width:960px;margin:0 auto;padding:20px 14px 56px;display:flex;flex-direction:column;gap:20px}
.section-group{display:flex;flex-direction:column;gap:14px;padding:15px;border-radius:22px;background:rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.6)}
.section-group.tint-blue{background:linear-gradient(135deg,rgba(238,242,255,.65),rgba(224,231,254,.5));border-color:rgba(199,210,254,.65)}
.section-group.tint-green{background:linear-gradient(135deg,rgba(240,253,244,.65),rgba(220,252,231,.5));border-color:rgba(187,247,208,.65)}
.section-group.tint-amber{background:linear-gradient(135deg,rgba(255,251,235,.7),rgba(254,243,199,.55));border-color:rgba(253,230,138,.65)}
.section-group.tint-pink{background:linear-gradient(135deg,rgba(252,231,243,.58),rgba(251,207,232,.45));border-color:rgba(251,207,232,.65)}
.section-group.tint-slate{background:linear-gradient(135deg,rgba(248,250,252,.72),rgba(241,245,249,.6));border-color:rgba(226,232,240,.8)}
.section-label{display:flex;align-items:center;gap:8px;padding:0 4px;margin-bottom:-2px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:#475569}
.section-label::before{content:'';width:4px;height:15px;border-radius:3px;background:linear-gradient(180deg,#6366f1,#8b5cf6)}
.section-label .sl-count{margin-left:auto;background:rgba(99,102,241,.14);color:#4338ca;padding:2px 10px;border-radius:999px;font-size:11.5px;font-weight:800;font-family:var(--font-num)}
.card-block{background:var(--glass);backdrop-filter:blur(18px) saturate(180%);border:1px solid var(--glass-border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:14px}
.card-head{display:flex;align-items:center;gap:10px;font-size:15.5px;font-weight:800;color:var(--text)}
.card-head .ic{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;background:linear-gradient(135deg,#eef2ff,#e0e7ff);color:#4f46e5;flex-shrink:0}
.card-head .ic.green{background:linear-gradient(135deg,#d1fae5,#a7f3d0);color:#059669}
.card-head .ic.blue{background:linear-gradient(135deg,#dbeafe,#bfdbfe);color:#1e40af}
.card-head .ic.pink{background:linear-gradient(135deg,#fce7f3,#fbcfe8);color:#be185d}
.today-highlight{background:linear-gradient(135deg,rgba(99,102,241,.93) 0%,rgba(139,92,246,.93) 48%,rgba(236,72,153,.88) 100%);border:1px solid rgba(255,255,255,.42);border-radius:22px;padding:22px 20px 18px;color:#fff;position:relative;overflow:hidden;cursor:pointer;transition:.2s;text-align:center;box-shadow:0 20px 46px -16px rgba(99,102,241,.58),inset 0 1px 0 rgba(255,255,255,.4)}
.th-content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.th-label{font-size:12.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;opacity:.95;display:flex;align-items:center;gap:6px}
.th-num-wrap{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:2px 0 4px}
.th-number{font-size:56px;font-weight:800;line-height:1.1;letter-spacing:-1.5px;text-shadow:0 6px 24px rgba(0,0,0,.18)}
.th-number.bn-hero-text{font-family:var(--font-sans);font-size:34px;font-weight:800;letter-spacing:0.4px;word-spacing:8px;line-height:1.3}
.th-unit{font-size:16px;font-weight:800;opacity:.92}
.th-sub{font-size:12.5px;font-weight:600;background:rgba(255,255,255,.22);display:inline-block;padding:5px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.32)}
.th-cta{font-size:11.5px;opacity:.9;margin-top:6px;font-weight:700}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stat-card{background:var(--glass);backdrop-filter:blur(18px);border:1px solid var(--glass-border);border-radius:17px;padding:16px 12px;text-align:center;box-shadow:var(--shadow-sm);min-height:98px;display:flex;flex-direction:column;justify-content:center;gap:4px;transition:.2s;position:relative}
.stat-card .stat-ic{font-size:18px;margin-bottom:2px;display:flex;justify-content:center}
.stat-card.primary{background:linear-gradient(135deg,rgba(99,102,241,.94),rgba(139,92,246,.94));color:#fff}
.stat-card.green{background:linear-gradient(135deg,rgba(16,185,129,.94),rgba(5,150,105,.94));color:#fff}
.stat-card.red{background:linear-gradient(135deg,rgba(239,68,68,.94),rgba(220,38,38,.94));color:#fff}
.stat-num{font-size:32px;font-weight:800;letter-spacing:-1px;line-height:1.05}
.stat-label{font-size:11.5px;opacity:.92;font-weight:700;margin-top:2px}
.stat-card.clickable{cursor:pointer}
.stat-card.clickable:hover{transform:translateY(-2px)}
.upcoming-single-card{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,rgba(224,231,255,.92),rgba(199,210,254,.84));border:1.5px solid rgba(165,180,252,.92);border-radius:20px;padding:18px 20px;cursor:pointer;transition:.2s}
.usc-icon{width:52px;height:52px;border-radius:15px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff}
.usc-text{flex:1;min-width:0}
.usc-title{font-size:15.5px;font-weight:800;color:#312e81}
.usc-sub{font-size:12.5px;color:#4338ca;margin-top:3px;font-weight:600}
.usc-right{display:flex;flex-direction:column;align-items:center;flex-shrink:0}
.usc-count{font-size:36px;font-weight:800;letter-spacing:-1.5px;line-height:1;color:#4f46e5}
.usc-unit{font-size:11px;font-weight:800;color:#6366f1;margin-top:2px}
.list{list-style:none;display:flex;flex-direction:column;gap:10px}
.list li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 15px;border:1px solid var(--border);border-radius:13px;background:rgba(255,255,255,.75);flex-wrap:wrap}
.list li small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.list li.empty{color:var(--muted);justify-content:center;font-style:italic;border-style:dashed}
.pill{background:var(--success);color:#fff;border-radius:999px;padding:4px 11px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill.blue{background:#4f46e5}
.pill.amber{background:#f59e0b}
.pill.red{background:var(--danger)}
.grid-2{display:grid;grid-template-columns:1fr;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.link-box{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.link-box input{flex:1;font-size:12.5px;min-width:0;background:#fff;font-family:ui-monospace,monospace}
.phone-wrap{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.phone-num{font-weight:600}
.phone-action{width:27px;height:27px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;text-decoration:none;border:none;cursor:pointer;background:#eef2ff;color:#4f46e5}
.phone-action.call-btn{background:#dcfce7;color:#059669}
.phone-action.copy-btn{background:#dbeafe;color:#1e40af}
.user-admin-list{display:flex;flex-direction:column;gap:12px}
.user-admin-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border:1.5px solid var(--border);border-radius:15px;background:rgba(255,255,255,.75);flex-wrap:wrap}
.ua-left{display:flex;gap:12px;align-items:flex-start;flex:1;min-width:0}
.ua-avatar{width:46px;height:46px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:21px;color:#fff;background:linear-gradient(135deg,#6366f1,#8b5cf6)}
.ua-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ua-name{font-weight:800;font-size:15px;color:var(--text);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ua-self{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px}
.ua-role{font-size:11px;font-weight:700;color:var(--primary);text-transform:uppercase}
.ua-phone{font-size:12.5px;color:var(--text);margin-top:2px}
.ua-email{font-size:12px;color:var(--muted);word-break:break-all}
.ua-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.ua-toggle-wrap{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 10px;border-radius:12px;background:rgba(248,250,252,.85);border:1px solid var(--border)}
.ua-toggle-label{font-size:10.5px;font-weight:800}
.ua-toggle-label.on{color:var(--success)}
.ua-toggle-label.off{color:var(--danger)}

   ============================================================ */
const DEVELOPER = 'Md. Nurunnabi | Assistant Professor, Dept. of Bangla.';
const APP_VERSION = '2.2.0';
const ANNOUNCE_DEFAULT_DAYS = 7;
const APP_LOGO = '🍽️';
const APP_TOKEN = 'mgmc_7f4a2c9e1b8d6a3c5e0d2f8b4a9c7e1d';

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const pad = n => String(n).padStart(2, '0');
const bnNum = n => String(n == null ? '' : n);

/* PWA Install Support ("Meal" app with main logo in standalone Chrome window) */
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredInstallPrompt = e;
  const installBtn = $('#menuInstallBtn');
  if (installBtn) installBtn.style.display = 'flex';
});
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

const todayStr = () => {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
};
const addDays = (dateStr, n) => {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + Number(n || 0));
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
};
const startOfSaturdayWeek = (baseDateStr = todayStr()) => {
  const d = new Date(baseDateStr + 'T00:00:00');
  const day = d.getDay();
  const diffSinceSat = (day + 1) % 7;
  return addDays(baseDateStr, -diffSinceSat);
};
/* Full day and month name everywhere (e.g. মঙ্গলবার, 10 নভেম্বর 2026) */
const fmtDate = d => {
  const dt = new Date(d + 'T00:00:00');
  const wk = dt.toLocaleDateString('bn-BD', { weekday: 'long' });
  const mon = dt.toLocaleDateString('bn-BD', { month: 'long' });
  return `${wk}, ${dt.getDate()} ${mon} ${dt.getFullYear()}`;
};
const fmtDateLong = d => fmtDate(d);
const fmtShort = d => {
  const dt = new Date(d + 'T00:00:00');
  const mon = dt.toLocaleDateString('bn-BD', { month: 'long' });
  const wk = dt.toLocaleDateString('bn-BD', { weekday: 'long' });
  return `${dt.getDate()} ${mon} (${wk})`;
};
/* Shortest English date without year for teacher main card pill: e.g. 10 Nov. */
const fmtShortEnNoYear = d => {
  const dt = new Date(d + 'T00:00:00');
  const months = ['Jan.','Feb.','Mar.','Apr.','May','Jun.','Jul.','Aug.','Sep.','Oct.','Nov.','Dec.'];
  return `${dt.getDate()} ${months[dt.getMonth()]}`;
};
const fmtDateTime = ts => {
  if (!ts) return '—';
  const dt = new Date(ts);
  const mon = dt.toLocaleDateString('bn-BD', { month: 'long' });
  const hr = dt.getHours();
  const min = pad(dt.getMinutes());
  const ampm = hr >= 12 ? 'PM' : 'AM';
  const hr12 = hr % 12 || 12;
  return `${dt.getDate()} ${mon} ${dt.getFullYear()}, ${hr12}:${min} ${ampm}`;
};
const fmtTime12 = time24 => {
  if (!time24 || !time24.includes(':')) return time24 || '';
  const [hStr, mStr] = time24.split(':');
  const h = Number(hStr), m = Number(mStr);
  const ampm = h >= 12 ? 'PM' : 'AM';
  const h12 = h % 12 || 12;
  return `${pad(h12)}:${pad(m)} ${ampm}`;
};
const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

function calIconSVG(size = 18) {
  return `<svg class="cal-svg" style="width:${size}px;height:${size}px" viewBox="0 0 24 24">
    <rect x="3" y="4" width="18" height="18" rx="3"></rect>
    <line x1="16" y1="2" x2="16" y2="6"></line>

    <line x1="3" y1="10" x2="21" y2="10"></line>
    <circle cx="8" cy="14" r="1" fill="currentColor"></circle>
    <circle cx="12" cy="14" r="1" fill="currentColor"></circle>
    <circle cx="16" cy="14" r="1" fill="currentColor"></circle>
  </svg>`;
}
function dynamicCalBadge(dateStr) {
  const d = new Date((dateStr || todayStr()) + 'T00:00:00');
  const mon = d.toLocaleDateString('en-US', { month: 'short' });
  const day = d.getDate();
  return `<span class="cal-dynamic-badge" title="${esc(fmtDate(dateStr || todayStr()))}">
    <span class="cdb-top">${esc(mon)}</span>
    <span class="cdb-day">${day}</span>
  </span>`;
}
function bellIconSVG() {
  return `<svg viewBox="0 0 24 24">
    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
  </svg>`;
}

  return `<svg viewBox="0 0 24 24">
    <line x1="3" y1="6" x2="21" y2="6"></line>
    <line x1="3" y1="12" x2="21" y2="12"></line>
    <line x1="3" y1="18" x2="21" y2="18"></line>

function roleIcon(r) {
  return { superadmin: '👑', matron: '🏠', teacher: '📚', mess_manager: '🍽️' }[r] || '👤';
}
function isValidPhone(p) { return /^01[0-9]{9}$/.test(String(p || '').trim()); }
function isValidEmail(e) { return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(e || '').trim()); }
function normalizePhone(p) {
  const digits = String(p || '').replace(/\D/g, '');
  if (digits.length === 13 && digits.startsWith('8801')) return digits.slice(2);
  return digits;
}
function fmtPhone(p) {
  if (!p) return '—';
  const s = String(p).trim();
  if (s.length === 11 && /^\d{11}$/.test(s)) return `${s.slice(0,4)}-${s.slice(4,7)}-${s.slice(7)}`;
  return s;
}
function phoneHTML(phone) {
  if (!phone) return '<span class="phone-empty">—</span>';
  const p = String(phone).trim();
  const f = fmtPhone(p);
  return `<span class="phone-wrap">
    <span class="phone-num">📱 ${esc(f)}</span>
    <a href="tel:${esc(p)}" class="phone-action call-btn" title="কল করুন">📞</a>
    <button type="button" class="phone-action copy-btn" data-copy-phone="${esc(p)}" title="নম্বর কপি করুন">📋</button>
  </span>`;
}
function creatorBadgeHTML(x) {
  if (!x) return '';
  const when = x.approved_at ? fmtDate(new Date(x.approved_at).toISOString().slice(0,10)) : '';
  let label = '', icon = '📄', cls = 'creator-badge';
  if (x.approved_by === 'superadmin') { icon = '👑'; cls += ' admin'; label = 'সুপার এডমিন কর্তৃক অনুমোদিত'; }
  else if (x.approved_by === 'matron') { icon = '📋'; cls += ' matron'; label = `মেট্রন ${x.created_by_name || '—'} কর্তৃক অনুমোদিত`; }
  else if (x.approved_by === 'matron-invite') { icon = '🔗'; cls += ' matron'; label = `মেট্রন ${x.created_by_name || '—'} এর Invite থেকে`; }
  else if (x.approved_by === 'system') { icon = '⚙️'; label = 'System seed account'; }
  else if (x.created_by_name) { label = `${x.created_by_name} কর্তৃক তৈরি`; }
  else return '';
  return `<div class="${cls}" title="${esc(x.approval_note || '')}">
      <span>${icon}</span><span>${esc(label)}</span>${when ? `<span>· ${when}</span>` : ''}
    </div>`;
}

/* ============================================================
   SECURITY: Salted Hashing + Signed Session Tokens + API Token
   ============================================================ */
function legacyHashPassword(pw) {
  let h = 5381;
  for (let i = 0; i < pw.length; i++) h = ((h << 5) + h + pw.charCodeAt(i)) | 0;
  return 'h' + (h >>> 0).toString(36);
}
function hashPassword(pw) {
  const s = String(pw || '');
  let h1 = 0x811c9dc5, h2 = 0x1000193;
  const salted = `MGMC_v2_SALT::${s}::${s.length * 97}`;
  for (let round = 0; round < 64; round++) {
    for (let i = 0; i < salted.length; i++) {
      const c = salted.charCodeAt(i) ^ (round * 31);
      h1 ^= c; h1 = Math.imul(h1, 0x01000193);
      h2 ^= (c + round); h2 = Math.imul(h2, 0x85ebca6b);
    }
  }
  return 'v2$' + (h1 >>> 0).toString(36) + '$' + (h2 >>> 0).toString(36) + '$' + legacyHashPassword(s).slice(1);
}
function verifyPassword(inputPw, storedHash) {
  if (!storedHash) return false;
  if (storedHash.startsWith('v2$')) return hashPassword(inputPw) === storedHash;
  return legacyHashPassword(inputPw) === storedHash || hashPassword(inputPw) === storedHash;
}

const DB_KEY = 'mgmc_db_v22';
const SESSION_KEY = 'mgmc_session_token_v22';
const RATE_LIMIT_KEY = 'mgmc_login_attempts_v22';

function apiFetch(url, opts = {}) {
  const headers = new Headers(opts.headers || {});
  headers.set('X-App-Token', APP_TOKEN);
  return fetch(url, { ...opts, headers });
}

function signSessionToken(user) {
  if (!user || !user.id) return '';
  const payload = `${user.id}|${user.password}|${user.role}|${user.active}`;
  const sig = hashPassword(payload).replace(/\$/g, '.');
  return `${user.id}.${sig}`;
}
function setStoredSession(user) {
  try {
    if (!user || !user.id) localStorage.removeItem(SESSION_KEY);
    else localStorage.setItem(SESSION_KEY, signSessionToken(user));
  } catch (e) {}
}
function verifyAndResolveSession(usersList) {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if (!raw || !raw.includes('.')) return null;
    const [idStr] = raw.split('.');
    const uid = Number(idStr);
    if (!uid || !Array.isArray(usersList)) return null;
    const user = usersList.find(u => u.id === uid);
    if (!user || !user.active) return null;
    if (raw !== signSessionToken(user)) {
      localStorage.removeItem(SESSION_KEY);
      return null;
    }
    return user.id;
  } catch (e) { return null; }
}

function checkLoginLockout() {
  try {
    const data = JSON.parse(localStorage.getItem(RATE_LIMIT_KEY) || '{}');
    if (data.lockedUntil && Date.now() < data.lockedUntil) {
      return Math.ceil((data.lockedUntil - Date.now()) / 1000);
    }
    return 0;
  } catch { return 0; }
}
function recordLoginAttempt(success) {
  try {
    if (success) { localStorage.removeItem(RATE_LIMIT_KEY); return; }
    const data = JSON.parse(localStorage.getItem(RATE_LIMIT_KEY) || '{"count":0}');
    data.count = (data.count || 0) + 1;
    if (data.count >= 5) { data.lockedUntil = Date.now() + 30000; data.count = 0; }
    localStorage.setItem(RATE_LIMIT_KEY, JSON.stringify(data));
  } catch {}
}

function toast(text, ok = false) {
  const t = document.createElement('div');
  t.className = 'toast ' + (ok ? 'ok' : 'err');
  t.textContent = text;
  document.body.appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3200);
}
function footerHTML() {

}

function copyToClipboard(text, msg) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => toast(msg, true), () => fallbackCopy(text, msg));
  } else fallbackCopy(text, msg);
}
function fallbackCopy(text, msg) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast(msg, true);
  } catch { toast('কপি করা যায়নি'); }
}

let db = null;
let isLoaded = false;
let syncMode = 'local';

function ensureSeedAdminExists(targetDb) {
  const hasActiveAdmin = (targetDb.users || []).some(u => u.role === 'superadmin' && u.active === 1);
  if (!hasActiveAdmin) {
    const existingSeed = (targetDb.users || []).find(
      u => u.email === DEFAULT_ADMIN.email || normalizePhone(u.phone) === DEFAULT_ADMIN.phone
    );
    const now = Date.now();
    if (existingSeed) {
      existingSeed.role = 'superadmin';
      existingSeed.active = 1;
      if (!existingSeed.password) existingSeed.password = hashPassword(DEFAULT_ADMIN.password);
      existingSeed.updated_at = now;
    } else {
      const maxUid = (targetDb.users || []).reduce((m, u) => Math.max(m, u.id || 0), 0);
      targetDb.nextIds = targetDb.nextIds || { users: 1, meals: 1, announcements: 1, notifications: 1 };
      targetDb.nextIds.users = Math.max(targetDb.nextIds.users || 1, maxUid + 1);
      targetDb.users.push({
        id: targetDb.nextIds.users++,
        name: 'Super Admin',
        email: DEFAULT_ADMIN.email,
        phone: DEFAULT_ADMIN.phone,
        password: hashPassword(DEFAULT_ADMIN.password),
        role: 'superadmin',
        active: 1,
        created_at: now,
        updated_at: now,
        created_by: null, created_by_name: null, created_by_role: null,
        approved_at: now, approved_by: 'system', approval_note: 'System seed account'
      });
    }
    return true;
  }
  return false;
}

function unpackSettingsMeta(target) {
  target.settings = (target.settings && typeof target.settings === 'object') ? target.settings : {};
  if ((!target.notifications || !target.notifications.length) && target.settings.__notifications_json) {
    try { target.notifications = JSON.parse(target.settings.__notifications_json); } catch {}
  }
  if ((!target.tombstones || !Object.keys(target.tombstones).length) && target.settings.__tombstones_json) {
    try { target.tombstones = JSON.parse(target.settings.__tombstones_json); } catch {}
  }
  if (target.settings.__day_meta_json) {
    try {
      const meta = JSON.parse(target.settings.__day_meta_json);
      target.day_settings = target.day_settings || {};
      for (const [d, m] of Object.entries(meta)) {
        target.day_settings[d] = { ...(target.day_settings[d] || {}), ...m };
      }
    } catch {}
  }
}

function packSettingsMeta(target) {
  target.settings = target.settings || {};
  target.settings.__notifications_json = JSON.stringify((target.notifications || []).slice(-250));
  target.settings.__tombstones_json = JSON.stringify(target.tombstones || {});
  const dayMeta = {};
  for (const [d, r] of Object.entries(target.day_settings || {})) {
    dayMeta[d] = {
      cutoff_days_before: r.cutoff_days_before ?? null,
      cutoff_date: r.cutoff_date ?? null
    };
  }
  target.settings.__day_meta_json = JSON.stringify(dayMeta);
}

function normalizeDB(target) {
  if (!target || typeof target !== 'object') target = blankDB();
  unpackSettingsMeta(target);
  target.users = Array.isArray(target.users) ? target.users : [];
  target.meals = Array.isArray(target.meals) ? target.meals : [];
  target.announcements = Array.isArray(target.announcements) ? target.announcements : [];
  target.notifications = Array.isArray(target.notifications) ? target.notifications : [];
  target.tombstones = (target.tombstones && typeof target.tombstones === 'object') ? target.tombstones : {};
  for (const [k, v] of Object.entries(DEFAULT_SETTINGS)) {
    if (target.settings[k] == null || target.settings[k] === '') target.settings[k] = v;
  }
  target.day_settings = (target.day_settings && typeof target.day_settings === 'object') ? target.day_settings : {};
  target.invites = Array.isArray(target.invites) ? target.invites : [];
  target.nextIds = target.nextIds || { users: 1, meals: 1, announcements: 1, notifications: 1 };

  const maxU = target.users.reduce((m, x) => Math.max(m, x.id || 0), 0);
  const maxM = target.meals.reduce((m, x) => Math.max(m, x.id || 0), 0);
  const maxA = target.announcements.reduce((m, x) => Math.max(m, x.id || 0), 0);
  const maxN = target.notifications.reduce((m, x) => Math.max(m, x.id || 0), 0);
  target.nextIds.users = Math.max(target.nextIds.users || 1, maxU + 1);
  target.nextIds.meals = Math.max(target.nextIds.meals || 1, maxM + 1);
  target.nextIds.announcements = Math.max(target.nextIds.announcements || 1, maxA + 1);
  target.nextIds.notifications = Math.max(target.nextIds.notifications || 1, maxN + 1);

  target.users.forEach(u => {
    if (!('phone' in u)) u.phone = '';
    if (!('updated_at' in u)) u.updated_at = u.created_at || 1;
    if (!('approved_at' in u)) u.approved_at = u.active ? (u.created_at || Date.now()) : null;
    if (!('approved_by' in u)) u.approved_by = u.role === 'superadmin' ? 'system' : null;
    if (!('approval_note' in u)) u.approval_note = u.role === 'superadmin' ? 'System seed account' : null;
  });
  target.meals.forEach(m => {
    if (!('updated_at' in m)) m.updated_at = m.served_at || m.created_at || 1;
  });
  ensureSeedAdminExists(target);
  return target;
}

function mergeDatabases(serverRaw, localRaw, actorRole, actorId) {
  const s = normalizeDB(serverRaw);
  const l = normalizeDB(localRaw);
  const mergedTombstones = { ...s.tombstones, ...l.tombstones };

  const mealKey = m => `${m.user_id}_${m.date}_${m.meal_type || 'lunch'}`;
  const mealMap = new Map();
  s.meals.forEach(m => mealMap.set(mealKey(m), { ...m }));
  l.meals.forEach(m => {
    if (actorRole === 'teacher' && m.user_id !== actorId) return;
    const k = mealKey(m);
    const tDel = mergedTombstones['meal_' + k] || 0;
    if (tDel > (m.updated_at || m.created_at || 0)) return;
    const existing = mealMap.get(k);
    if (!existing || (m.updated_at || m.created_at || 0) >= (existing.updated_at || existing.created_at || 0)) {
      mealMap.set(k, { ...m });
    }
  });
  const finalMeals = [];
  for (const [k, m] of mealMap.entries()) {
    const tDel = mergedTombstones['meal_' + k] || 0;
    if (tDel <= (m.updated_at || m.created_at || 0)) finalMeals.push(m);
  }

  const userMap = new Map();
  s.users.forEach(u => userMap.set(u.id, { ...u }));
  l.users.forEach(u => {
    if (mergedTombstones['user_' + u.id]) return;
    if (actorRole === 'teacher' && u.id !== actorId) return;
    const ex = userMap.get(u.id);
    if (!ex || (u.updated_at || 0) >= (ex.updated_at || 0)) {
      if (ex && actorRole && actorRole !== 'superadmin' && u.role !== ex.role) u.role = ex.role;
      userMap.set(u.id, { ...u });
    }
  });
  const finalUsers = [];
  for (const [id, u] of userMap.entries()) {
    if (!mergedTombstones['user_' + id]) finalUsers.push(u);
  }

  const notifMap = new Map();
  s.notifications.forEach(n => notifMap.set(n.id, { ...n }));
  l.notifications.forEach(n => {
    const ex = notifMap.get(n.id);
    if (!ex || (n.read && !ex.read) || (n.created_at || 0) >= (ex.created_at || 0)) {
      notifMap.set(n.id, { ...n });
    }
  });

  const annMap = new Map();
  s.announcements.forEach(a => annMap.set(a.id, { ...a }));
  l.announcements.forEach(a => {
    if (!mergedTombstones['ann_' + a.id]) annMap.set(a.id, { ...a });
  });

  const useLocalAdminSettings = (!actorRole || actorRole === 'superadmin');
  const finalSettings = useLocalAdminSettings ? { ...s.settings, ...l.settings } : { ...s.settings };
  const finalDaySettings = useLocalAdminSettings ? { ...l.day_settings } : { ...s.day_settings };

  const invMap = new Map();
  s.invites.forEach(i => invMap.set(i.token, { ...i }));
  l.invites.forEach(i => invMap.set(i.token, { ...invMap.get(i.token), ...i }));

  return normalizeDB({
    users: finalUsers,
    meals: finalMeals,
    announcements: Array.from(annMap.values()).filter(a => !mergedTombstones['ann_' + a.id]),
    notifications: Array.from(notifMap.values()).slice(-250),
    tombstones: mergedTombstones,
    settings: finalSettings,
    day_settings: finalDaySettings,
    invites: Array.from(invMap.values()),
    session: null,
    nextIds: {
      users: Math.max(s.nextIds.users, l.nextIds.users),
      meals: Math.max(s.nextIds.meals, l.nextIds.meals),
      announcements: Math.max(s.nextIds.announcements, l.nextIds.announcements),
      notifications: Math.max(s.nextIds.notifications, l.nextIds.notifications)
    }
  });
}

async function loadDatabase() {
  let localCopy = null;
  try {
    const raw = localStorage.getItem(DB_KEY) || localStorage.getItem('mgmc_db_v21') || localStorage.getItem('mgmc_db_v20') || localStorage.getItem('mgmc_db_v18');
    if (raw) localCopy = JSON.parse(raw);
  } catch (e) {}

  try {
    const response = await apiFetch('/api/db', { cache: 'no-store' });
    if (response.ok) {
      const serverData = await response.json();
      syncMode = 'cloud';
      if (serverData && serverData.users && serverData.users.length > 0) {
        const hadAdmin = serverData.users.some(u => u.role === 'superadmin' && u.active === 1);
        db = normalizeDB(serverData);
        if (!hadAdmin) await persist();
      } else {
        db = normalizeDB(localCopy || blankDB());
        await persist();
      }
    } else {
      throw new Error('HTTP ' + response.status);
    }
  } catch (error) {
    syncMode = location.protocol.startsWith('http') ? 'cloud' : 'local';
    db = normalizeDB(localCopy || blankDB());
    packSettingsMeta(db);
    try { localStorage.setItem(DB_KEY, JSON.stringify({ ...db, session: null })); } catch (e) {}
  }

  db.session = verifyAndResolveSession(db.users);
  isLoaded = true;
  render();
}

async function persist() {
  const actor = currentUser();
  const prevSync = syncMode;
  syncMode = 'saving';
  updateSyncIndicator();

  try {
    const getRes = await apiFetch('/api/db', { cache: 'no-store' });
    if (getRes.ok) {
      const latestServer = await getRes.json();
      if (latestServer && typeof latestServer === 'object') {
        const activeSessionId = db.session;
        db = mergeDatabases(latestServer, db, actor?.role || null, actor?.id || null);
        db.session = activeSessionId;
      }
    }
    packSettingsMeta(db);
    const snapshot = { ...db, session: null };
    try { localStorage.setItem(DB_KEY, JSON.stringify(snapshot)); } catch (e) {}

    const postRes = await apiFetch('/api/db', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(snapshot)
    });
    syncMode = postRes.ok ? 'cloud' : (prevSync === 'cloud' ? 'cloud' : 'local');
  } catch (err) {
    syncMode = location.protocol.startsWith('http') ? 'cloud' : 'local';
    packSettingsMeta(db);
    const snapshot = { ...db, session: null };
    try { localStorage.setItem(DB_KEY, JSON.stringify(snapshot)); } catch (e) {}
  }
  updateSyncIndicator();
}

function updateSyncIndicator() {
  const el = $('#syncStatusPill');
  if (!el) return;
  if (syncMode === 'saving') el.innerHTML = `<span class="sync-dot saving"></span> সেভ হচ্ছে…`;
  else if (syncMode === 'cloud') el.innerHTML = `<span class="sync-dot"></span> অনলাইন`;
  else el.innerHTML = `<span class="sync-dot local"></span> লোকাল প্রিভিউ`;
}

function resetAllData() {
  try { localStorage.removeItem(DB_KEY); localStorage.removeItem('mgmc_db_v21'); localStorage.removeItem('mgmc_db_v20'); localStorage.removeItem('mgmc_db_v18'); } catch (e) {}
  try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
  apiFetch('/api/db', { method: 'DELETE' }).catch(() => {}).finally(() => {
    location.hash = '';
    location.reload();
  });
}

/* ============================================================
   SMART CUTOFF & DYNAMIC ADVANCE DAYS ENGINE
   ============================================================ */
function getDaySettings(date) {
  const defCutoff = db.settings.cutoff_time || '10:00';
  const defDaysBefore = Number(db.settings.cutoff_days_before || 0);
  const defEnabled = db.settings.lunch_enabled === '1';
  const row = db.day_settings[date];

  const cutoffTime = (row && row.cutoff_time) ? row.cutoff_time : defCutoff;
  const daysBefore = (row && row.cutoff_days_before != null && row.cutoff_days_before !== '')
    ? Number(row.cutoff_days_before)
    : defDaysBefore;
  const exactCutoffDate = (row && row.cutoff_date) ? row.cutoff_date : addDays(date, -daysBefore);
  const enabled = (row && row.lunch_enabled != null) ? row.lunch_enabled === 1 : defEnabled;

  return { date, cutoff: cutoffTime, cutoff_days_before: daysBefore, cutoff_date: exactCutoffDate, enabled };
}

function getCutoffTimestamp(date) {
  const s = getDaySettings(date);
  const [h, m] = (s.cutoff || '10:00').split(':').map(Number);
  const dt = new Date(s.cutoff_date + 'T00:00:00');
  dt.setHours(h || 0, m || 0, 0, 0);
  return dt.getTime();
}

function isPastCutoffFor(date) {
  const today = todayStr();
  if (date < today) return true;
  return Date.now() > getCutoffTimestamp(date);
}

function formatCutoffDeadlineBN(date) {
  const s = getDaySettings(date);
  const today = todayStr();
  const tomorrow = addDays(today, 1);
  let dayLabel = fmtShort(s.cutoff_date);
  if (s.cutoff_date === today) dayLabel = 'আজ';
  else if (s.cutoff_date === tomorrow) dayLabel = 'আগামীকাল';
  return `${dayLabel} ${fmtTime12(s.cutoff)}`;
}

function maxAdvanceDate() { return addDays(todayStr(), getMaxAdvanceDays()); }

function currentUser() {
  if (!db || !db.session) return null;
  const verifiedId = verifyAndResolveSession(db.users);
  if (!verifiedId) { db.session = null; return null; }
  return db.users.find(x => x.id === verifiedId) || null;
}

function rawMealFor(userId, date) {
  const key = `${userId}_${date}_lunch`;
  if (db.tombstones && db.tombstones['meal_' + key]) {
    const m = db.meals.find(x => x.user_id === userId && x.date === date && x.meal_type === 'lunch');
    if (m && (m.updated_at || m.created_at || 0) <= db.tombstones['meal_' + key]) return null;
  }
  return db.meals.find(m => m.user_id === userId && m.date === date && m.meal_type === 'lunch');
}

function deleteMealRecord(userId, date) {
  const key = `${userId}_${date}_lunch`;
  db.tombstones = db.tombstones || {};
  db.tombstones['meal_' + key] = Date.now();
  db.meals = db.meals.filter(m => !(m.user_id === userId && m.date === date && m.meal_type === 'lunch'));
}

function pushNotification(userId, title, message, kind = 'served') {
  db.notifications = db.notifications || [];
  db.notifications.push({
    id: db.nextIds.notifications++,
    user_id: userId, title, message, kind, read: 0, created_at: Date.now()
  });
}

function userNotifications(userId) {
  return (db.notifications || [])
    .filter(n => n.user_id === userId || n.user_id === 'all')
    .sort((a, b) => (b.created_at || 0) - (a.created_at || 0));
}

function statsFor(date) {
  const list = db.meals.filter(m => m.date === date && m.meal_type === 'lunch' && m.confirmed === 1);
  const enriched = list.map(m => {
    const u = db.users.find(x => x.id === m.user_id) || {};
    return {
      user_id: m.user_id, name: u.name || '—', email: u.email || '—',
      phone: u.phone || '', role: u.role || '—',
      served: !!m.served, served_at: m.served_at || null, created_at: m.created_at || null
    };
  });
  const total = enriched.length;
  const served = enriched.filter(x => x.served).length;
  return {
    date, total, served, remaining: total - served, list: enriched,
    capacity: Number(db.settings.meal_capacity || 0),
    price: Number(db.settings.meal_price || 0)
  };
}

function daySummary(date) {
  const list = db.meals
    .filter(m => m.date === date && m.meal_type === 'lunch' && m.confirmed === 1)
    .map(m => {
      const u = db.users.find(x => x.id === m.user_id) || {};
      return {
        name: u.name || '—', phone: u.phone || '', role: u.role || '—',
        served: !!m.served, served_at: m.served_at || null, created_at: m.created_at || null
      };
    })
    .sort((a, b) => a.name.localeCompare(b.name, 'bn'));
  return { date, count: list.length, list };
}

function upcomingDays(fromDate, days) {
  const out = [];
  for (let i = 0; i < days; i++) out.push(daySummary(addDays(fromDate, i)));
  return out;
}

function visibleAnnouncements() {
  const now = Date.now();
  return (db.announcements || [])
    .filter(a => now - (a.created_at || 0) < (a.visible_days || ANNOUNCE_DEFAULT_DAYS) * 86400000)
    .sort((a, b) => (b.created_at || 0) - (a.created_at || 0));
}

function myOrdersFor(userId) {
  const today = todayStr();
  return db.meals
    .filter(m => m.user_id === userId && m.meal_type === 'lunch' && m.date >= today && m.confirmed === 1)
    .map(m => ({
      id: m.id, date: m.date, served: !!m.served, served_at: m.served_at || null,
      created_at: m.created_at || 0, canDelete: !isPastCutoffFor(m.date)
    }))
    .sort((a, b) => a.date.localeCompare(b.date));
}

function myUnconfirmedFor(userId) {
  const today = todayStr();
  return db.meals
    .filter(m => m.user_id === userId && m.meal_type === 'lunch' && m.date >= today && (m.confirmed === 0 || m.confirmed == null))
    .map(m => ({ date: m.date, created_at: m.created_at || 0 }))
    .sort((a, b) => a.date.localeCompare(b.date));
}

function rangeReport(from, to, onlyUserId = null) {
  const out = [];
  let cur = from, safety = 0;
  while (cur <= to && safety < 400) {
    safety++;
    if (onlyUserId != null) {
      const m = db.meals.find(x => x.user_id === onlyUserId && x.date === cur && x.meal_type === 'lunch' && x.confirmed === 1);
      out.push({ date: cur, total: m ? 1 : 0, served: (m && m.served) ? 1 : 0, remaining: (m && !m.served) ? 1 : 0 });
    } else {
      const s = statsFor(cur);
      out.push({ date: cur, total: s.total, served: s.served, remaining: s.remaining });
    }
    cur = addDays(cur, 1);
  }
  return out;
}

        </div>` : ''}
      ${list.length ? list.map(a => {
        const author = db.users.find(x => x.id === a.created_by);
        const canDelete = u.role === 'matron' || u.role === 'superadmin';
        const days = a.visible_days || ANNOUNCE_DEFAULT_DAYS;
        const expiresAt = (a.created_at || 0) + days * 86400000;
        const daysLeft = Math.max(0, Math.ceil((expiresAt - Date.now()) / 86400000));
        return `
          <div class="announce-item">
            ${canDelete ? `<button class="del-btn" data-ann-del="${a.id}" title="মুছুন">✕</button>` : ''}
            <div class="title">${esc(a.title)}</div>
            <div class="body">${esc(a.body)}</div>
            <div class="meta">
              <span>👤 ${esc(author?.name || 'মেট্রন')}</span>
              <span>🕒 ${fmtDateTime(a.created_at)}</span>
              <span>⏳ আরও ${daysLeft} দিন</span>
            </div>
          </div>`;
      }).join('') : `<div style="text-align:center;color:#9a3412;font-size:13px;padding:4px">এখনো কোনো অ্যানাউন্সমেন্ট নেই</div>`}
    </div>`;

  if (canPost) {
    $('#toggleAnnForm')?.addEventListener('click', () => {
      state.showAnnounceForm = !state.showAnnounceForm;
      renderAnnouncements(u);
    });
    $('#postAnn')?.addEventListener('click', async () => {
      const title = $('#anTitle').value.trim();
      const body = $('#anBody').value.trim();
      const days = Number($('#anDays').value) || ANNOUNCE_DEFAULT_DAYS;
      if (!title || !body) return setMsg('anMsg', 'শিরোনাম ও বিস্তারিত দিন');
      db.announcements.push({
        id: db.nextIds.announcements++, title, body, visible_days: days,
        created_by: u.id, created_at: Date.now()
      });
      await persist();
      state.showAnnounceForm = false;
      toast('✅ অ্যানাউন্সমেন্ট পোস্ট হয়েছে', true);
      renderAnnouncements(u);
    });
  }
  $$('[data-ann-del]').forEach(b => b.onclick = async () => {
    const id = Number(b.dataset.annDel);
    if (!confirm('এই অ্যানাউন্সমেন্ট মুছে ফেলবেন?')) return;
    db.tombstones = db.tombstones || {};
    db.tombstones['ann_' + id] = Date.now();
    db.announcements = db.announcements.filter(x => x.id !== id);
    await persist();
    toast('মুছে ফেলা হয়েছে', true);
    renderAnnouncements(u);
  });
}

/* ============================================================

function openNotificationsModal() { state.modal = { type: 'notifications' }; renderModal(); }
function openDayModal(date, title) {
  const info = daySummary(date);
  state.modal = {
    type: 'day',
    title: title || `${fmtDateLong(date)} — বিস্তারিত`,
    subtitle: `মোট ${info.count} জন খাবার নিচ্ছেন`,
    people: info.list,
    empty: 'এই দিনে এখনো কেউ খাবার রিকোয়েস্ট করেনি।'
  };
  renderModal();
}
function openListModal(title, subtitle, people, empty) {
  state.modal = {
    type: 'day', title, subtitle,
    people: people.map(p => ({
      name: p.name, phone: p.phone, served: !!p.served,
      created_at: p.created_at || null, served_at: p.served_at || null
    })),
    empty: empty || 'কোনো তথ্য নেই।'
  };
  renderModal();
}
function openUpcomingDaysModal(title, days) { state.modal = { type: 'daysList', title, days }; renderModal(); }
function openReportModal(onlyUserId = null) {
  state.modal = {
    type: 'report',
    from: startOfSaturdayWeek(todayStr()),
    to: todayStr(),
    range: 'thisweek',
    onlyUserId
  };
  renderModal();
}
function openProfileModal() { state.modal = { type: 'profile', showPw: false }; renderModal(); }
function openConfirmModal({ title, message, dateLabel, danger, iconType, yesLabel, noLabel, onYes }) {
  state.modal = { type: 'confirm', title, message, dateLabel, danger, iconType, yesLabel, noLabel, onYes };
  renderModal();
}
function openAdminResetModal() { state.modal = { type: 'adminReset' }; renderModal(); }
function openBackupModal(mode = 'backup') { state.modal = { type: 'backupRestore', mode }; renderModal(); }
function openUserEditModal(userId) { state.modal = { type: 'userEdit', userId }; renderModal(); }
function closeModal() { state.modal = null; renderModal(); }

            <div class="confirm-icon warning" style="margin-bottom:14px">🔒</div>
            <div class="confirm-title">নিশ্চিত করতে পাসওয়ার্ড দিন</div>
            <div class="confirm-msg">সাবধান! সব ইউজার, মিল, সেটিংস মুছে যাবে।</div>
          </div>
          <div style="margin-top:16px">
            <label>অ্যাডমিন পাসওয়ার্ড
              <div class="input-wrap">
                <input type="password" id="resetPw" placeholder="পাসওয়ার্ড">
                <button type="button" class="pw-eye" data-pw-toggle="resetPw">👁️</button>
              </div>
            </label>
            <div class="msg" id="resetMsg" style="margin-top:8px"></div>
          </div>
        </div>
        <div class="modal-foot">
          <button class="btn btn-ghost" id="closeModalBtn2" style="flex:1">বাতিল</button>
          <button class="btn btn-danger" id="doResetBtn" style="flex:1">🗑️ রিসেট করুন</button>
        </div>
      </div>`;
  } else if (state.modal.type === 'userEdit') {
    const usr = db.users.find(x => x.id === state.modal.userId);
    if (!usr) { state.modal = null; return; }
    el.innerHTML = `
      <div class="modal-card" role="dialog">
        <div class="modal-head">
          <div><h3>✏️ ইউজার এডিট</h3>
            <div class="hint" style="margin-top:2px">${esc(usr.name)} — ${esc(roleLabel(usr.role))}</div>
          </div>
          <button class="close-btn" id="closeModalBtn">✕</button>
        </div>
        <div class="modal-body">
          <form id="userEditForm" style="display:flex;flex-direction:column;gap:14px">
            <label>নাম<input id="ueName" value="${esc(usr.name)}" required></label>
            <label>মোবাইল নম্বর (11 ডিজিট)<input id="uePhone" type="tel" inputmode="numeric" value="${esc(usr.phone || '')}" maxlength="11" required></label>
            <label>ইমেইল<input id="ueEmail" type="email" value="${esc(usr.email)}" required></label>
            <label>ভূমিকা
              <select id="ueRole">
                ${['superadmin','matron','teacher','mess_manager']
                  .map(r => `<option value="${r}" ${usr.role === r ? 'selected' : ''}>${roleLabel(r)}</option>`).join('')}
              </select>
            </label>
            <label>নতুন পাসওয়ার্ড (ঐচ্ছিক)
              <div class="input-wrap">
                <input type="password" id="uePass" minlength="6" placeholder="খালি রাখলে অপরিবর্তিত থাকবে">
                <button type="button" class="pw-eye" data-pw-toggle="uePass">👁️</button>
              </div>
            </label>
            <div class="msg" id="ueMsg"></div>
          </form>
        </div>
        <div class="modal-foot">
          <button class="btn btn-ghost" id="closeModalBtn2" style="flex:1">বাতিল</button>
          <button class="btn btn-primary" id="saveUserBtn" style="flex:1">💾 সেভ করুন</button>
        </div>
      </div>`;
  } else if (state.modal.type === 'confirm') {
    const { title, message, dateLabel, danger, iconType, yesLabel, noLabel, onYes } = state.modal;
    let iconCls = 'confirm-icon';
    if (iconType === 'warning') iconCls += ' warning';
    else if (danger) iconCls += ' danger';
    const iconEmoji = danger ? '⚠️' : iconType === 'warning' ? '🚪' : '🍽️';
    el.innerHTML = `
      <div class="modal-card" role="dialog" style="max-width:400px">
        <div class="modal-body" style="padding:0">
          <div class="confirm-popup">
            <div class="${iconCls}">${iconEmoji}</div>
            <div class="confirm-title">${esc(title || 'Confirm Order?')}</div>
            <div class="confirm-msg">${esc(message || '')}</div>
            ${dateLabel ? `<div class="confirm-date">${calIconSVG(15)} ${esc(dateLabel)}</div>` : ''}
            <div class="confirm-actions">
              <button class="btn-no" id="confirmNoBtn">✖️ ${esc(noLabel || 'না')}</button>
              <button class="btn-yes" id="confirmYesBtn">✅ ${esc(yesLabel || 'হ্যাঁ')}</button>
            </div>
          </div>
        </div>
      </div>`;
  }

  document.body.appendChild(el);

  if ($('#closeModalBtn')) $('#closeModalBtn').onclick = closeModal;
  if ($('#closeModalBtn2')) $('#closeModalBtn2').onclick = closeModal;
  el.onclick = e => { if (e.target === el) closeModal(); };

  if (state.modal.type === 'confirm') {
    $('#confirmNoBtn').onclick = closeModal;
    $('#confirmYesBtn').onclick = () => {
      const cb = state.modal.onYes;
      closeModal();
      if (typeof cb === 'function') cb();
    };
  }

  if (state.modal.type === 'notifications') {
    const markBtn = $('#markNotifReadBtn');
    if (markBtn) markBtn.onclick = async () => {
      const u = currentUser();
      if (!u) return;
      (db.notifications || []).forEach(n => {
        if (n.user_id === u.id || n.user_id === 'all') n.read = 1;
      });
      await persist();
      closeModal();
      render();
    };
  }

  el.querySelectorAll('[data-jump-day]').forEach(div => {
    div.onclick = () => {
      const date = div.dataset.jumpDay;
      const isEmpty = div.classList.contains('empty');
      if (isEmpty && state.modal.type === 'daysList') return;
      closeModal();
      setTimeout(() => openDayModal(date), 100);
    };
  });

  if (state.modal.type === 'report') {
    const onlyUserId = state.modal.onlyUserId;
    el.querySelectorAll('[data-range]').forEach(b => {
      b.onclick = () => {
        const r = b.dataset.range;
        const today = todayStr();
        let from = today, to = today;
        if (r === 'today') { from = today; to = today; }
        else if (r === 'thisweek') { from = startOfSaturdayWeek(today); to = today; }
        else if (r === '30days') { from = addDays(today, -29); to = today; }
        else if (r === 'month') {
          const d = new Date();
          from = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-01`;
          to = today;
        } else if (r === 'advance') {
          from = today;
          to = maxAdvanceDate();
        } else if (r === 'custom') {
          state.modal = { type: 'report', from: state.modal.from, to: state.modal.to, range: 'custom', onlyUserId };
          renderModal(); return;
        }
        state.modal = { type: 'report', from, to, range: r, onlyUserId };
        renderModal();
      };
    });
    const applyBtn = $('#applyReport');
    if (applyBtn) applyBtn.onclick = () => {
      const f = $('#rptFrom').value;
      const t = $('#rptTo').value;
      if (!f || !t || f > t) return toast('তারিখ ঠিকভাবে বাছাই করুন');
      state.modal = { type: 'report', from: f, to: t, range: 'custom', onlyUserId };
      renderModal();
    };
  }

  if (state.modal.type === 'backupRestore') {
    const isRestore = state.modal.mode === 'restore';
    $('#confirmBkBtn').onclick = async () => {
      const pw = $('#bkAdminPass').value;
      if (!pw) return setMsg('bkMsg', 'পাসওয়ার্ড দিন');
      if (!me || me.role !== 'superadmin' || !verifyPassword(pw, me.password)) {
        return setMsg('bkMsg', '❌ ভুল অ্যাডমিন পাসওয়ার্ড!');
      }
      if (!isRestore) {
        const now = Date.now();
        db.settings.last_backup_at = String(now);
        await persist();
        const dt = new Date(now);
        const stamp = `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}_${pad(dt.getHours())}-${pad(dt.getMinutes())}-${pad(dt.getSeconds())}`;
        const backupPayload = {
          meta: {
            app: 'MGMC Meal Management',
            version: APP_VERSION,
            exported_at: now,
            exported_at_iso: dt.toISOString(),
            exported_at_formatted: fmtDateTime(now),
            exported_by: me.name
          },
          data: { ...db, session: null }
        };
        const blob = new Blob([JSON.stringify(backupPayload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `mgmc-backup-${stamp}.json`;
        document.body.appendChild(a); a.click();
        document.body.removeChild(a); URL.revokeObjectURL(url);
        toast('✅ সম্পূর্ণ ব্যাকআপ ডাউনলোড সম্পন্ন হয়েছে!', true);
        closeModal();
        renderAdmin();
      } else {
        const fileInput = $('#restoreFileInput');
        if (!fileInput || !fileInput.files || !fileInput.files[0]) {
          return setMsg('bkMsg', 'অনুগ্রহ করে একটি ব্যাকআপ (.json) ফাইল নির্বাচন করুন');
        }
        try {
          const text = await fileInput.files[0].text();
          const parsed = JSON.parse(text);
          const restoredDB = parsed.data && parsed.data.users ? parsed.data : (parsed.users ? parsed : null);
          if (!restoredDB || !Array.isArray(restoredDB.users)) {
            return setMsg('bkMsg', '❌ ফাইলটি সঠিক MGMC ব্যাকআপ ফাইল নয়');
          }
          db = normalizeDB(restoredDB);
          packSettingsMeta(db);
          const currentAdmin = db.users.find(u => u.id === me.id) || db.users.find(u => u.role === 'superadmin' && u.active);
          if (currentAdmin) { db.session = currentAdmin.id; setStoredSession(currentAdmin); }
          const snapshot = { ...db, session: null };
          try { localStorage.setItem(DB_KEY, JSON.stringify(snapshot)); } catch (e) {}
          try {
            await apiFetch('/api/db', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(snapshot)
            });
          } catch (e) {}
          toast('✅ ব্যাকআপ ফাইল থেকে সফলভাবে ডেটা রিস্টোর হয়েছে!', true);
          closeModal();
          render();
        } catch (err) {
          setMsg('bkMsg', '❌ ফাইল পড়তে সমস্যা হয়েছে: সঠিক JSON ফাইল দিন');
        }
      }
    };
  }

  if (state.modal.type === 'profile') {
    const pfPhoneEl = $('#pfPhone');
    if (pfPhoneEl) pfPhoneEl.addEventListener('input', () => { pfPhoneEl.value = pfPhoneEl.value.replace(/\D/g, '').slice(0, 11); });
    const toggleBtn = $('#togglePwBtn');
    if (toggleBtn) toggleBtn.onclick = () => { state.modal.showPw = !state.modal.showPw; renderModal(); };
    $('#saveProfileBtn').onclick = async () => {
      if (!me) return;
      const name = $('#pfName').value.trim();
      const phone = normalizePhone($('#pfPhone').value.trim());
      const email = $('#pfEmail').value.toLowerCase().trim();
      if (!name || !phone || !email) return setMsg('pfMsg', 'সব তথ্য দিন');
      if (!isValidPhone(phone)) return setMsg('pfMsg', 'সঠিক 11 ডিজিটের মোবাইল নম্বর দিন');
      if (!isValidEmail(email)) return setMsg('pfMsg', 'সঠিক ইমেইল অ্যাড্রেস দিন');
      if (db.users.find(x => x.email.toLowerCase() === email && x.id !== me.id)) return setMsg('pfMsg', 'এই ইমেইল আগে থেকেই আছে');
      if (db.users.find(x => normalizePhone(x.phone) === phone && x.id !== me.id)) return setMsg('pfMsg', 'এই মোবাইল নম্বর আগে থেকেই আছে');

      const pwOld = $('#pwOld') ? $('#pwOld').value : '';
      const pwNew = $('#pwNew') ? $('#pwNew').value : '';
      const pwNew2 = $('#pwNew2') ? $('#pwNew2').value : '';
      let changedPw = false;
      if (pwOld || pwNew || pwNew2) {
        if (!pwOld || !pwNew || !pwNew2) return setMsg('pwMsg', 'তিনটি ফিল্ড পূরণ করুন');
        if (!verifyPassword(pwOld, me.password)) return setMsg('pwMsg', 'পুরনো পাসওয়ার্ড ভুল');
        if (pwNew.length < 6) return setMsg('pwMsg', 'নতুন পাসওয়ার্ড কমপক্ষে 6 অক্ষর');
        if (pwNew !== pwNew2) return setMsg('pwMsg', 'নতুন পাসওয়ার্ড দুইবার একই দিন');
        me.password = hashPassword(pwNew);
        changedPw = true;
      }
      me.name = name; me.phone = phone; me.email = email;
      me.updated_at = Date.now();
      setStoredSession(me);
      await persist();
      toast(changedPw ? '✅ Profile ও পাসওয়ার্ড আপডেট হয়েছে' : '✅ Profile আপডেট হয়েছে', true);
      closeModal();
      render();
    };
  }

  if (state.modal.type === 'adminReset') {
    $('#doResetBtn').onclick = () => {
      const pw = $('#resetPw').value;
      if (!pw) return setMsg('resetMsg', 'পাসওয়ার্ড দিন');
      if (!me || !verifyPassword(pw, me.password)) return setMsg('resetMsg', 'ভুল পাসওয়ার্ড');
      if (!confirm('শেষবারের মতো নিশ্চিত? এটা ফেরানো যাবে না।')) return;
      resetAllData();
    };
  }

  if (state.modal.type === 'userEdit') {
    const uePhoneEl = $('#uePhone');
    if (uePhoneEl) uePhoneEl.addEventListener('input', () => { uePhoneEl.value = uePhoneEl.value.replace(/\D/g, '').slice(0, 11); });
    $('#saveUserBtn').onclick = async () => {
      const usr = db.users.find(x => x.id === state.modal.userId);
      if (!usr) return;
      const name = $('#ueName').value.trim();
      const phone = normalizePhone($('#uePhone').value.trim());
      const email = $('#ueEmail').value.toLowerCase().trim();
      const role = $('#ueRole').value;
      const pass = $('#uePass').value;
      if (!name || !phone || !email) return setMsg('ueMsg', 'সব তথ্য দিন');
      if (!isValidPhone(phone)) return setMsg('ueMsg', 'সঠিক 11 ডিজিটের মোবাইল নম্বর দিন');
      if (!isValidEmail(email)) return setMsg('ueMsg', 'সঠিক ইমেইল অ্যাড্রেস দিন');
      if (db.users.find(x => x.email.toLowerCase() === email && x.id !== usr.id)) return setMsg('ueMsg', 'এই ইমেইল আগে থেকেই আছে');
      if (db.users.find(x => normalizePhone(x.phone) === phone && x.id !== usr.id)) return setMsg('ueMsg', 'এই মোবাইল নম্বর আগে থেকেই আছে');
      if (usr.role === 'superadmin' && role !== 'superadmin') {
        const cnt = db.users.filter(x => x.role === 'superadmin' && x.active).length;
        if (cnt <= 1) return setMsg('ueMsg', 'শেষ সুপার এডমিনের ভূমিকা পরিবর্তন করা যাবে না');
      }
      usr.name = name; usr.phone = phone; usr.email = email; usr.role = role;
      if (pass) {
        if (pass.length < 6) return setMsg('ueMsg', 'পাসওয়ার্ড কমপক্ষে 6 অক্ষর');
        usr.password = hashPassword(pass);
      }
      usr.updated_at = Date.now();
      if (usr.id === db.session) setStoredSession(usr);
      await persist();
      toast('✅ ইউজার আপডেট হয়েছে', true);
      closeModal();
      renderAdmin();
    };
  }
}

function todayHighlightHTML(count, served, opts = {}) {
  const label = opts.label || 'আজকের মিল';
  const icon = opts.icon || '🍽️';
  const sub = opts.sub || '';
  const cta = opts.cta || 'বিস্তারিত দেখতে ক্লিক করুন';
  return `
    <div class="today-highlight" data-highlight-click="1">
      <div class="th-content">
        <div class="th-label"><span>${icon}</span> ${esc(label)}</div>
        <div class="th-num-wrap">
          <span class="th-number">${count}</span>
          <span class="th-unit">জন</span>
        </div>
        ${sub ? `<div class="th-sub">${esc(sub)}</div>` : ''}
        <div class="th-cta">🔍 ${esc(cta)}</div>
      </div>
    </div>`;
}

function upcomingSingleCardHTML(upcoming) {
  const advDays = getMaxAdvanceDays();
  const totalAll = upcoming.reduce((a, x) => a + x.count, 0);
  const activeDays = upcoming.filter(x => x.count > 0).length;
  return `
    <div class="section-group tint-blue">
      <div class="section-label">
        ${calIconSVG(16)} আগামী ${advDays} দিনের অর্ডার
        <span class="sl-count">${totalAll} জন · ${activeDays} দিন</span>
      </div>
      <div class="upcoming-single-card" id="upcomingCard">
        <div class="usc-icon">${calIconSVG(26)}</div>
        <div class="usc-text">
          <div class="usc-title">আগামী ${advDays} দিনের রিকোয়েস্ট</div>
          <div class="usc-sub">${activeDays} দিনে অর্ডার আছে · বিস্তারিত দেখতে ক্লিক করুন</div>
        </div>
        <div class="usc-right">
          <div class="usc-count">${totalAll}</div>
          <div class="usc-unit">জন</div>
        </div>
      </div>
    </div>`;
}

/* ============================================================
   TEACHER DASHBOARD
   - Main card big text has clean word-spacing & letter-spacing
   - Pill says: আজ (10 Nov.) এখনো অর্ডার করেননি
   - No cancel button below order status; delete only from "আমার অর্ডার সমূহ"
   - No report card in main view (kept only in 3-bar menu)
   ============================================================ */
function renderTeacher() {
  const u = currentUser();
  const v = $('#view');
  const advDays = getMaxAdvanceDays();
  const today = todayStr();
  const maxDate = maxAdvanceDate();
  if (state.teacherDate > maxDate) state.teacherDate = maxDate;
  if (state.teacherDate < today) state.teacherDate = today;
  const date = state.teacherDate;
  const isFuture = date > today;
  const meal = rawMealFor(u.id, date);
  const confirmedMeal = meal && meal.confirmed === 1;
  const unconfirmedMeal = meal && (meal.confirmed === 0 || meal.confirmed == null);
  const day = getDaySettings(date);
  const pastCutoff = isPastCutoffFor(date);
  const deadlineText = formatCutoffDeadlineBN(date);
  const cutoffText = `মিল দেওয়ার সময়সীমা (${deadlineText}) শেষ`;
  const locked = pastCutoff || !day.enabled;
  const lockReason = pastCutoff ? cutoffText : (!day.enabled ? 'এই দিনে দুপুরের খাবার বন্ধ' : '');
  const shortDate = fmtShort(date);
  const dateText = isFuture ? shortDate : 'আজ';

  const statusBadge = confirmedMeal
    ? `<div class="hero-status on">✅ আপনি এই দিনে খাবার নিচ্ছেন${meal.served ? ' · 🍽️ Served' : ''}</div>`
    : `<div class="hero-status">❌ এখনো রিকোয়েস্ট করেননি</div>`;

  const cutoffBanner = pastCutoff
    ? `<div class="cutoff-banner">⏰ মিল দেওয়ার সময়সীমা শেষ<small>${esc(dateText)}-এর অর্ডারের শেষ সময় ছিল: <b>${esc(deadlineText)}</b></small></div>`
    : (!day.enabled
        ? `<div class="cutoff-banner">🚫 এই দিনে দুপুরের খাবার বন্ধ</div>`
        : `<div class="cutoff">⏰ অর্ডার ও বাতিলের শেষ সময়: <b>${esc(deadlineText)}</b> পর্যন্ত</div>`);

  /* Order cancellation button removed from here; cancellation is only in "আমার অর্ডার সমূহ" below */
  let actions = '';
  if (confirmedMeal) {
    actions = `<div class="confirmed-banner">✅ <b>${esc(dateText)}</b> — কনফার্মড, আপনি এই দিনে খাবার পাবেন</div>`;
  } else if (unconfirmedMeal) {
    actions = `<button class="btn btn-xl btn-warning ${locked ? 'locked' : ''}" data-act="order">
      🍽️ ${esc(dateText)} — কনফার্ম করুন</button>`;
  } else {
    actions = `<button class="btn btn-xl btn-success ${locked ? 'locked' : ''}" data-act="order">
      🍽️ ${esc(dateText)} — খাবার খেতে চাই</button>`;
  }

  const myOrders = myOrdersFor(u.id);
  const unconfirmed = myUnconfirmedFor(u.id);
  const todayConfirmed = myOrders.find(o => o.date === today);
  const shortTodayBracket = fmtShortEnNoYear(today);

  const heroFinalHTML = todayConfirmed
    ? `<div class="today-highlight" style="cursor:default">
        <div class="th-content">
          <div class="th-label"><span>${todayConfirmed.served ? '🍽️' : '✅'}</span> আজ আপনার খাবার</div>
          <div class="th-num-wrap" style="margin:6px 0 8px">
            <span class="th-number bn-hero-text">${todayConfirmed.served ? 'পরিবেশিত' : 'কনফার্মড'}</span>
          </div>
          <div class="th-sub">আপনি আজ খাবার নিচ্ছেন</div>
        </div>
      </div>`

            <span>সম্পূর্ণ করুন →</span>
          </button>
        `).join('')}

    </div>` : '';

    <div class="section-group tint-amber">
      <div class="section-label">⚠️ সম্পূর্ণ হয়নি</div>
      <div class="unconfirmed-card">
        <div class="uc-icon">⚠️</div>
        <div class="uc-title">এই তারিখের অর্ডার সম্পূর্ণ হয়নি</div>
        <div class="uc-date">${calIconSVG(15)} ${esc(fmtShort(date))}</div>
        <div class="uc-actions">
          <button class="btn btn-success btn-block" id="ucConfirmBtn">✅ হ্যাঁ, খাবার চাই</button>
          <button class="btn btn-ghost danger btn-block" id="ucCancelBtn">✖️ না, বাতিল করুন</button>
        </div>
      </div>

    ${heroFinalHTML}
    ${unconfirmedHTML}
    ${dateUnconfirmedHTML}

    <div class="section-group tint-slate">
      <div class="section-label">${calIconSVG(15)} অর্ডার তারিখ বাছাই</div>
      <div class="card-block">
        <div class="card-head">
          ${dynamicCalBadge(date)}
          <div style="flex:1">
            <div>তারিখ নির্বাচন করুন</div>
            <div class="hint">সর্বোচ্চ ${advDays} দিন আগাম অর্ডার করা যাবে।</div>
          </div>
        </div>
        <div class="date-inputs">
          <button class="btn btn-ghost nav-arrow" id="tPrevDay">←</button>
          <input type="date" id="datePick" value="${date}" min="${today}" max="${maxDate}">
          <button class="btn btn-ghost nav-arrow" id="tNextDay">→</button>
        </div>
      </div>

      <div class="hero-card">
        <div class="hero-date">${calIconSVG(15)} ${fmtDate(date)}${date === today ? ' · আজ' : ''}</div>
        <div class="hero-title">🍽️ দুপুরের খাবার</div>
        ${statusBadge}
        ${cutoffBanner}
        <div class="hero-actions">${actions}</div>
      </div>
    </div>

    <div class="section-group tint-green">
      <div class="section-label">📋 আমার অর্ডার সমূহ <span class="sl-count">${myOrders.length}টি</span></div>
      <div class="card-block">
        ${myOrders.length ? `
          <p class="hint">🗑️ অর্ডার বাতিল করতে চাইলে পাশের ডিলিট বাটনে ক্লিক করুন। Cutoff সময়ের ভিতরেই কেবল ডিলিট করা যাবে।</p>
          <ul class="my-order-list">
            ${myOrders.map(o => {
              const isToday = o.date === today;
              const dt = new Date(o.date + 'T00:00:00');
              const wk = dt.toLocaleDateString('bn-BD', { weekday: 'long' });
              const mon = dt.toLocaleDateString('bn-BD', { month: 'long' });
              return `
                <li class="my-order-row ${isToday ? 'today' : ''}">
                  ${dynamicCalBadge(o.date)}
                  <div class="mo-info">
                    <b>${wk}, ${dt.getDate()} ${mon} ${dt.getFullYear()}${isToday ? ' (আজ)' : ''}</b>
                    <small>${o.served ? '✅ খাবার নেওয়া হয়েছে' : `⏰ শেষ সময়: ${formatCutoffDeadlineBN(o.date)}`}</small>
                  </div>
                  <div class="mo-actions">
                    <span class="pill">${o.served ? '✓ Served' : '✓'}</span>
                    <button class="btn-del-order ${o.canDelete ? '' : 'locked'}"
                            data-del-order="${o.date}"

                      ${o.canDelete ? '🗑️' : '🔒'}
                    </button>
                  </div>
                </li>`;
            }).join('')}

        ` : `<div class="hint" style="padding:16px;text-align:center;border:1px dashed var(--border);border-radius:12px">এখনো কোনো অর্ডার নেই</div>`}
      </div>
    </div>`;

  $('#tPrevDay').onclick = () => {
    const prev = addDays(state.teacherDate, -1);
    if (prev < today) return toast('আগের তারিখে অর্ডার করা যাবে না');
    state.teacherDate = prev; renderTeacher();
  };
  $('#tNextDay').onclick = () => {
    const next = addDays(state.teacherDate, 1);
    if (next > maxDate) return toast(`সর্বোচ্চ ${advDays} দিন আগাম`);
    state.teacherDate = next; renderTeacher();
  };

  $$('[data-del-order]').forEach(btn => {
    btn.onclick = e => {
      e.stopPropagation();
      const targetDate = btn.dataset.delOrder;
      if (btn.classList.contains('locked') || isPastCutoffFor(targetDate)) {
        return toast('⏰ মিল দেওয়ার সময়সীমা শেষ — এই অর্ডার ডিলিট করা যাবে না', false);
      }
      openConfirmModal({
        title: 'Delete Order?',
        message: 'আপনি কি এই অর্ডারটি ডিলিট করতে চান?',
        dateLabel: fmtShort(targetDate),
        danger: true,
        yesLabel: 'হ্যাঁ, ডিলিট',
        noLabel: 'বাতিল',
        onYes: async () => {
          deleteMealRecord(u.id, targetDate);
          await persist();
          toast('✅ অর্ডারটি ডিলিট করা হয়েছে', true);
          renderTeacher();
        }
      });
    };
  });

  $$('[data-jump]').forEach(b => b.onclick = () => { state.teacherDate = b.dataset.jump; renderTeacher(); });

  const ucConfirm = $('#ucConfirmBtn');
  if (ucConfirm) ucConfirm.onclick = () => {
    if (isPastCutoffFor(date)) return toast(cutoffText);
    openConfirmModal({
      title: 'Confirm Order?',
      message: 'আপনি কি এই তারিখের জন্য খাবার চূড়ান্ত করতে চান?',
      dateLabel: dateText,
      onYes: async () => {
        const m = rawMealFor(u.id, date);
        if (m) { m.confirmed = 1; m.updated_at = Date.now(); }
        await persist();
        toast(`✅ ${dateText} — খাবার কনফার্ম হয়েছে`, true);
        renderTeacher();
      }
    });
  };

  const ucCancel = $('#ucCancelBtn');
  if (ucCancel) ucCancel.onclick = () => {
    if (isPastCutoffFor(date)) return toast(cutoffText);
    openConfirmModal({
      title: 'Cancel Order?',
      message: 'আপনি কি এই তারিখের অর্ডারটি বাতিল করতে চান?',
      dateLabel: dateText, danger: true,
      onYes: async () => {
        deleteMealRecord(u.id, date);
        await persist();
        toast(`${dateText} — বাতিল হয়েছে`, true);
        renderTeacher();
      }
    });
  };

  $('#datePick').onchange = e => {
    const val = e.target.value;
    if (val > maxDate) {
      toast(`সর্বোচ্চ ${advDays} দিন আগাম`);
      e.target.value = state.teacherDate; return;
    }
    state.teacherDate = val; renderTeacher();
  };

  $$('[data-act]').forEach(btn => {
    btn.onclick = async () => {
      if (btn.classList.contains('locked')) return toast(lockReason || 'এখন অর্ডার করা যাবে না');
      const act = btn.dataset.act;
      const me = currentUser();
      const d = state.teacherDate;
      const label = d > todayStr() ? fmtShort(d) : 'আজ';
      if (act === 'order') {
        if (!getDaySettings(d).enabled) return toast('এই দিনে দুপুরের খাবার বন্ধ');
        if (isPastCutoffFor(d)) return toast(cutoffText);
        if (d > maxAdvanceDate()) return toast(`সর্বোচ্চ ${advDays} দিন`);
        const now = Date.now();
        let m = rawMealFor(me.id, d);
        if (!m) {
          delete db.tombstones['meal_' + `${me.id}_${d}_lunch`];
          db.meals.push({
            id: db.nextIds.meals++, user_id: me.id, date: d, meal_type: 'lunch',
            confirmed: 0, served: 0, served_at: null, created_at: now, updated_at: now
          });
          await persist();
          renderTeacher();
        }
        openConfirmModal({
          title: 'Confirm Order?',
          message: 'আপনি কি এই দিনের জন্য খাবার অর্ডার করতে চান?',
          dateLabel: label,
          onYes: async () => {
            const existing = rawMealFor(me.id, d);
            if (existing) { existing.confirmed = 1; existing.updated_at = Date.now(); }
            await persist();
            toast(`✅ ${label} — খাবার কনফার্ম হয়েছে`, true);
            renderTeacher();
          }
        });
      }
    };
  });
}

          <label>নাম<input id="mmName" placeholder="পূর্ণ নাম"></label>

    else if (kind === 'served') openListModal('খাবার নিয়েছেন', `${s.served} জন খাবার নিয়েছেন`, s.list.filter(x => x.served), 'এখনো কেউ খাবার নেয়নি।');

    else if (kind === 'upcoming') openUpcomingDaysModal(`আগামী ${advDays} দিনের রিকোয়েস্ট`, upcoming);
  };

  $$('[data-stat]').forEach(c => c.onclick = () => showForMatron(c.dataset.stat));
