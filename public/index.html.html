  $('#upcomingCard').onclick = () => openUpcomingDaysModal(`আগামী ${advDays} দিনের রিকোয়েস্ট`, upcoming);

  $$('.mm-toggle').forEach(t => {
    t.onchange = async () => {
      const mgr = db.users.find(x => x.id === Number(t.dataset.id));
      if (!mgr) return;
      mgr.active = t.checked ? 1 : 0;
      mgr.updated_at = Date.now();
      await persist();
      renderMatron();
      toast(mgr.active ? `${mgr.name} — অ্যাক্সেস চালু` : `${mgr.name} — অ্যাক্সেস বন্ধ`, !!mgr.active);
    };
  });

  $('#createManager').onclick = async () => {
    const name = $('#mmName').value.trim();
    const phone = normalizePhone($('#mmPhone').value.trim());
    const email = $('#mmEmail').value.toLowerCase().trim();
    const pass = $('#mmPass').value;
    if (!name || !phone || !email || !pass) return setMsg('mmMsg', 'সব তথ্য দিন');
    if (!isValidPhone(phone)) return setMsg('mmMsg', 'সঠিক 11 ডিজিটের মোবাইল নম্বর দিন');
    if (!isValidEmail(email)) return setMsg('mmMsg', 'সঠিক ইমেইল অ্যাড্রেস দিন');
    if (pass.length < 6) return setMsg('mmMsg', 'পাসওয়ার্ড কমপক্ষে 6 অক্ষর');
    if (db.users.find(x => x.email.toLowerCase() === email)) return setMsg('mmMsg', 'এই ইমেইল আগে থেকেই আছে');
    if (db.users.find(x => normalizePhone(x.phone) === phone)) return setMsg('mmMsg', 'এই মোবাইল নম্বর আগে থেকেই আছে');
    const now = Date.now();
    db.users.push({
      id: db.nextIds.users++, name, email, phone,
      password: hashPassword(pass), role: 'mess_manager',
      active: 1, created_at: now, updated_at: now,
      created_by: u.id, created_by_name: u.name, created_by_role: u.role,
      approved_at: now, approved_by: 'matron',
      approval_note: `মেট্রন ${u.name} কর্তৃক অনুমোদিত`
    });
    await persist();
    toast('✅ Mess Manager তৈরি হয়েছে!', true);
    renderMatron();
  };

  $('#genInvite').onclick = async () => {
    const token = Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 10);
    db.invites.push({
      token, created_by: u.id,
      expires_at: Date.now() + 7 * 24 * 3600 * 1000,
      used_by: null, used_at: null, created_at: Date.now()
    });
    await persist();
    const url = location.href.split('#')[0] + '#invite=' + token;
    $('#linkInput').value = url;
    $('#copyBtn').dataset.copyText = url;
    $('#linkBox').style.display = 'flex';
    setMsg('invMsg', '✅ লিংক তৈরি হয়েছে — কপি করুন', true);
  };
}

/* ============================================================
   MESS MANAGER
   ============================================================ */
function renderManager() {
  const v = $('#view');
  const today = todayStr();
  const advDays = getMaxAdvanceDays();
  const maxDate = maxAdvanceDate();
  if (state.managerDate > maxDate) state.managerDate = maxDate;
  const date = state.managerDate;
  const isToday = date === today;
  const s = statsFor(date);

  let filtered = s.list;
  if (state.managerFilter === 'served') filtered = filtered.filter(x => x.served);
  if (state.managerFilter === 'unserved') filtered = filtered.filter(x => !x.served);
  const notServed = filtered.filter(x => !x.served);
  const served = filtered.filter(x => x.served);
  const upcoming = upcomingDays(today, advDays);
  const totalFuture = upcoming.reduce((a, x) => a + x.count, 0);

  v.innerHTML = `
    ${todayHighlightHTML(s.total, s.served, {
      label: isToday ? 'আজকের মিল' : `${fmtShort(date)} — মোট মিল`,
      icon: '🍽️',
      sub: `${s.total} জন খাবার নিচ্ছেন · ${s.served} জন নিয়েছেন`,

      if (!li.dataset.serve) return;

        if (e.target.closest('.phone-action')) return;
        const uid = Number(li.dataset.serve);
        const m = db.meals.find(x => x.user_id === uid && x.date === date && x.meal_type === 'lunch' && x.confirmed === 1);
        if (!m) return toast('এই ইউজারের কোনো মিল নেই');
        const usr = db.users.find(u => u.id === uid);

        if (m.served) {
          openConfirmModal({
            title: 'Unmark Served Meal?',
            message: `আপনি কি নিশ্চিতভাবে "${usr?.name || 'এই ইউজার'}"-এর খাবার "নেয়নি (Unserved)" হিসেবে আনমার্ক করতে চান?`,

            danger: true,
            yesLabel: 'হ্যাঁ, আনমার্ক করুন',
            noLabel: 'না, থাকুক',

              m.served = 0;
              m.served_at = null;
              m.updated_at = Date.now();
              await persist();
              toast('আনমার্ক করা হয়েছে', true);
              renderManager();
            }
          });
          return;
        }

        const now = Date.now();
        m.served = 1;
        m.served_at = now;
        m.updated_at = now;
        pushNotification(
          uid,
          '✅ দুপুরের খাবার পরিবেশিত হয়েছে',
          `${fmtDate(date)} তারিখের দুপুরের খাবার আপনাকে পরিবেশন (Served) করা হয়েছে।`,

        renderManager();
      };
    });
  }
}

function checklistItemHTML(x, isServed, readonly) {
  return `
    <li class="checklist-item ${isServed ? 'served' : ''} ${readonly ? 'readonly' : ''}"
        data-serve="${readonly ? '' : x.user_id}">
      <div class="check-left">
        <span class="checkbox">${isServed ? '✓' : '✕'}</span>
        <div class="check-info">
          <b>${esc(x.name)}</b>
          <small>${x.phone ? phoneHTML(x.phone) : '—'}</small>
        </div>
      </div>
      <span class="check-tag">${isServed ? 'খাবার নিয়েছে' : 'খাবার নেয়নি'}</span>
    </li>`;
}

function downloadCSV(date) {
  const s = statsFor(date);
  const escape = v => {
    const str = v == null ? '' : String(v);
    return /[",\n]/.test(str) ? `"${str.replace(/"/g, '""')}"` : str;
  };
  const fmtTime = ts => ts ? fmtDateTime(ts) : '';
  const lines = [['#', 'Name', 'Phone', 'Role', 'Served', 'Served At', 'Requested At'].join(',')];
  s.list.forEach((r, i) => {
    lines.push([i + 1, escape(r.name), escape(r.phone), r.role, r.served ? 'Yes' : 'No', escape(fmtTime(r.served_at)), escape(fmtTime(r.created_at))].join(','));
  });
  const blob = new Blob(['\uFEFF' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `mgmc-meals-${date}.csv`;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
  toast('CSV ডাউনলোড শুরু হয়েছে', true);
}

            <select id="nRole">
              <option value="teacher">শিক্ষক</option>
              <option value="matron">হোস্টেল মেট্রন</option>
              <option value="mess_manager">Mess Manager</option>
              <option value="superadmin">সুপার এডমিন</option>
            </select>
          </label>
        </div>
        <button class="btn btn-primary btn-block" id="addUser">➕ যোগ করুন</button>
        <div class="msg" id="addMsg"></div>
      </div>
    </div>

    <div class="section-group tint-pink">
      <div class="section-label">👥 ইউজার ম্যানেজমেন্ট <span class="sl-count">${users.length} জন</span></div>
      <div class="card-block">
        <div class="user-admin-list">
          ${users.map(x => `
            <div class="user-admin-row">
              <div class="ua-left">
                <div class="ua-avatar">${roleIcon(x.role)}</div>
                <div class="ua-info">
                  <div class="ua-name">
                    ${esc(x.name)}
                    ${x.id === u.id ? '<span class="ua-self">আপনি</span>' : ''}
                  </div>
                  <div class="ua-role">${esc(roleLabel(x.role))}</div>
                  <div class="ua-phone">${phoneHTML(x.phone)}</div>
                  <div class="ua-email">📧 ${esc(x.email)}</div>
                  ${creatorBadgeHTML(x)}
                </div>
              </div>
              <div class="ua-actions">
                <div class="ua-toggle-wrap">
                  <label class="toggle-switch">
                    <input type="checkbox" class="ua-toggle" data-id="${x.id}" ${x.active ? 'checked' : ''}>
                    <span class="toggle-slider"></span>
                  </label>
                  <span class="ua-toggle-label ${x.active ? 'on' : 'off'}">${x.active ? 'চালু' : 'বন্ধ'}</span>
                </div>
                <button class="btn btn-ghost btn-sm" data-edit="${x.id}">✏️ এডিট</button>
                <button class="btn btn-ghost danger btn-sm" data-del="${x.id}">🗑️</button>
              </div>
            </div>`).join('')}
        </div>
      </div>
    </div>`;

  const nPhoneEl = $('#nPhone');
  if (nPhoneEl) nPhoneEl.addEventListener('input', () => { nPhoneEl.value = nPhoneEl.value.replace(/\D/g, '').slice(0, 11); });

  const showForAdmin = kind => {
    if (kind === 'today') openListModal('আজকের মিল', `${s.total} জন খাবার নিচ্ছেন`, s.list, 'আজ কেউ খাবার নেয়নি।');
    else if (kind === 'served') openListModal('খাবার নিয়েছেন', `${s.served} জন খাবার নিয়েছেন`, s.list.filter(x => x.served), 'এখনো কেউ খাবার নেয়নি।');
    else if (kind === 'unserved') openListModal('খাবার নেয়নি', `${s.remaining} জন এখনো খাবার নেয়নি`, s.list.filter(x => !x.served), 'সবাই খাবার নিয়েছেন।');
    else if (kind === 'users') document.querySelector('.user-admin-list')?.scrollIntoView({ behavior: 'smooth' });
  };
  $('[data-highlight-click]').onclick = () => showForAdmin('today');
  $$('[data-stat]').forEach(c => c.onclick = () => showForAdmin(c.dataset.stat));
  $('#viewReport').onclick = () => openReportModal();
  $('#openBackupBtn').onclick = () => openBackupModal('backup');
  $('#openRestoreBtn').onclick = () => openBackupModal('restore');
  $('#openResetBtn').onclick = () => openAdminResetModal();
  $('#upcomingCard').onclick = () => openUpcomingDaysModal(`আগামী ${getMaxAdvanceDays()} দিনের রিকোয়েস্ট`, upcoming);

  /* Live update of Advance Days & Settings */
  $('#saveSettings').onclick = async () => {
    const newAdv = Math.max(1, Math.min(90, Number($('#s_max_advance_days').value || 10)));
    db.settings.app_name = $('#s_app_name').value.trim() || DEFAULT_SETTINGS.app_name;
    db.settings.mess_name = $('#s_mess_name').value.trim() || DEFAULT_SETTINGS.mess_name;
    db.settings.max_advance_days = String(newAdv);
    db.settings.cutoff_days_before = $('#s_cutoff_days_before').value;
    db.settings.cutoff_time = $('#s_cutoff_time').value || '10:00';
    db.settings.meal_capacity = $('#s_meal_capacity').value;
    db.settings.meal_price = $('#s_meal_price').value;
    db.settings.lunch_enabled = $('#s_lunch_enabled').checked ? '1' : '0';
    await persist();
    toast('সেটিংস সেভ হয়েছে ✅', true);
    render();
  };

  $('#addUser').onclick = async () => {
    const name = $('#nName').value.trim();
    const phone = normalizePhone($('#nPhone').value.trim());
    const email = $('#nEmail').value.toLowerCase().trim();
    const pass = $('#nPass').value;
    const role = $('#nRole').value;
    if (!name || !email || !pass || !phone) return setMsg('addMsg', 'সব তথ্য দিন');
    if (!isValidPhone(phone)) return setMsg('addMsg', 'সঠিক 11 ডিজিটের মোবাইল নম্বর দিন (01XXXXXXXXX)');
    if (!isValidEmail(email)) return setMsg('addMsg', 'সঠিক ইমেইল অ্যাড্রেস দিন (যেমন: user@domain.com)');
    if (pass.length < 6) return setMsg('addMsg', 'পাসওয়ার্ড কমপক্ষে 6 অক্ষর');
    if (db.users.find(x => x.email.toLowerCase() === email)) return setMsg('addMsg', 'এই ইমেইল আগে থেকেই আছে');
    if (db.users.find(x => normalizePhone(x.phone) === phone)) return setMsg('addMsg', 'এই মোবাইল নম্বর আগে থেকেই আছে');
    const now = Date.now();
    db.users.push({
      id: db.nextIds.users++, name, email, phone,
      password: hashPassword(pass), role, active: 1,
      created_at: now, updated_at: now,
      created_by: u.id, created_by_name: u.name, created_by_role: 'superadmin',
      approved_at: now, approved_by: 'superadmin',
      approval_note: 'সুপার এডমিন কর্তৃক সরাসরি তৈরি'
    });
    await persist();
    toast('ইউজার যোগ হয়েছে ✅', true);
    renderAdmin();
  };

  $$('[data-approve]').forEach(b => b.onclick = async () => {
    const usr = db.users.find(x => x.id === Number(b.dataset.approve));
    if (usr) {
      usr.active = 1; usr.approved_at = Date.now(); usr.updated_at = Date.now();
      usr.approved_by = 'superadmin';
      usr.approval_note = `সুপার এডমিন ${u.name} কর্তৃক অনুমোদিত`;
      await persist(); renderAdmin();
    }
  });

  $$('[data-reject]').forEach(b => b.onclick = async () => {
    if (!confirm('এই রেজিস্ট্রেশন বাতিল করবেন?')) return;
    const id = Number(b.dataset.reject);
    db.tombstones['user_' + id] = Date.now();
    db.users = db.users.filter(x => x.id !== id);
    await persist(); renderAdmin();
  });

  $$('.ua-toggle').forEach(t => {
    t.onchange = async () => {
      const id = Number(t.dataset.id);
      const usr = db.users.find(x => x.id === id);
      if (!usr) return;
      if (usr.id === u.id && !t.checked) { t.checked = true; return toast('নিজের অ্যাকাউন্ট বন্ধ করা যাবে না'); }
      if (usr.role === 'superadmin' && !t.checked) {
        const cnt = db.users.filter(x => x.role === 'superadmin' && x.active).length;
        if (cnt <= 1) { t.checked = true; return toast('শেষ সুপার এডমিন নিষ্ক্রিয় করা যাবে না'); }
      }
      usr.active = t.checked ? 1 : 0;
      usr.updated_at = Date.now();
      await persist();
      renderAdmin();
      toast(usr.active ? `${usr.name} — অ্যাক্সেস চালু` : `${usr.name} — অ্যাক্সেস বন্ধ`, !!usr.active);
    };
  });

  $$('[data-edit]').forEach(b => b.onclick = () => openUserEditModal(Number(b.dataset.edit)));
  $$('[data-del]').forEach(b => b.onclick = async () => {
    const id = Number(b.dataset.del);
    if (id === u.id) return toast('নিজেকে মুছবেন না');
    const usr = db.users.find(x => x.id === id);
    if (!usr) return;
    if (usr.role === 'superadmin' && db.users.filter(x => x.role === 'superadmin').length <= 1)
      return toast('শেষ সুপার এডমিন মুছবেন না');
    if (!confirm(`"${usr.name}" কে মুছে ফেলবেন?`)) return;
    db.tombstones['user_' + id] = Date.now();
    db.users = db.users.filter(x => x.id !== id);
    db.meals = db.meals.filter(m => m.user_id !== id);
    await persist(); renderAdmin();
  });

  const dateEl = $('#ds_date');
  const ruleEl = $('#ds_rule_mode');
  const customDateWrap = $('#ds_custom_date_wrap');
  const customDateEl = $('#ds_cutoff_date');
  const cutEl = $('#ds_cutoff');
  const enEl = $('#ds_enabled');
  dateEl.value = addDays(todayStr(), 1);

  function syncRuleUI() { customDateWrap.style.display = ruleEl.value === 'custom' ? 'flex' : 'none'; }
  function loadOne() {
    const d = dateEl.value;
    const rawRow = db.day_settings[d];
    const s = getDaySettings(d);
    cutEl.value = s.cutoff;
    enEl.checked = s.enabled;
    if (rawRow && rawRow.cutoff_date) {
      ruleEl.value = 'custom';
      customDateEl.value = rawRow.cutoff_date;
    } else {
      ruleEl.value = String(s.cutoff_days_before || 0);
      customDateEl.value = s.cutoff_date;
    }
    syncRuleUI();
  }
  function loadList() {
    const listEl = $('#dsList');
    const upcomingList = Object.entries(db.day_settings)
      .filter(([d]) => d >= todayStr())
      .sort(([a], [b]) => a.localeCompare(b));
    listEl.innerHTML = upcomingList.length
      ? upcomingList.map(([d, r]) => `
          <li>
            <div>
              <b>${fmtDate(d)}</b>
              <small>Cutoff: ${formatCutoffDeadlineBN(d)} · খাবার: ${r.lunch_enabled === 0 ? 'বন্ধ' : 'চালু'}</small>
            </div>
          </li>`).join('')
      : '<li class="empty">কোনো override নেই</li>';
  }
  loadOne(); loadList();
  dateEl.onchange = loadOne;
  ruleEl.onchange = syncRuleUI;

  $('#ds_save').onclick = async () => {
    if (!dateEl.value) return setMsg('dsMsg', 'তারিখ দিন');
    const mode = ruleEl.value;
    const record = { cutoff_time: cutEl.value || '10:00', lunch_enabled: enEl.checked ? 1 : 0 };
    if (mode === 'custom') {
      if (!customDateEl.value) return setMsg('dsMsg', 'অর্ডারের শেষ তারিখ দিন');
      record.cutoff_date = customDateEl.value;
      record.cutoff_days_before = null;
    } else {
      record.cutoff_days_before = Number(mode);
      record.cutoff_date = null;
    }
    db.day_settings[dateEl.value] = record;
    await persist();
    setMsg('dsMsg', 'সেভ হয়েছে ✅', true);
    loadList();
  };

  $('#ds_remove').onclick = async () => {
    if (!db.day_settings[dateEl.value]) return setMsg('dsMsg', 'এই দিনে কোনো override নেই');
    delete db.day_settings[dateEl.value];
    await persist();
    setMsg('dsMsg', 'Override মুছে ফেলা হয়েছে', true);
    loadOne(); loadList();
  };
}

window.addEventListener('hashchange', () => {
  if (!currentUser()) renderAuth();
});

loadDatabase();
</script>
</body>
</html>
