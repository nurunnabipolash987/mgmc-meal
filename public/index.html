}

/* ============================================================
   TEACHER
   ============================================================ */
function renderTeacher() {
  const u = currentUser();
  const v = $('#view');
  const date = state.teacherDate;
  const today = todayStr();
  const maxDate = maxAdvanceDate();
  const isFuture = date > today;
  const meal = rawMealFor(u.id, date);
  const confirmedMeal = meal && meal.confirmed === 1;
  const unconfirmedMeal = meal && (meal.confirmed === 0 || meal.confirmed == null);
  const day = getDaySettings(date);
  const pastCutoff = isPastCutoffFor(date);

  const cutoffText = 'মিল দেওয়ার সময়সীমা আজকের মত শেষ';
  const locked = pastCutoff || !day.enabled;
  const lockReason = pastCutoff ? cutoffText : (!day.enabled ? 'এই দিনে দুপুরের খাবার বন্ধ' : '');

  const shortDate = fmtShort(date);
  const dateText = isFuture ? shortDate : 'আজ';

  let statusBadge;
  if (confirmedMeal) statusBadge = `<div class="hero-status on">✅ আপনি এই দিনে খাবার নিচ্ছেন</div>`;
  else statusBadge = `<div class="hero-status">❌ এখনো রিকোয়েস্ট করেননি</div>`;

  const cutoffBanner = pastCutoff
    ? `<div class="cutoff-banner">⏰ ${cutoffText}<small>${isFuture ? shortDate : 'আজকের'} অর্ডারের সময় ${day.cutoff} এ শেষ হয়েছে।</small></div>`
    : (!day.enabled
        ? `<div class="cutoff-banner neutral">🚫 এই দিনে দুপুরের খাবার বন্ধ</div>`
        : `<div class="cutoff ok">⏰ ${isFuture ? shortDate : 'আজ'} — ${day.cutoff} পর্যন্ত পরিবর্তন করা যাবে</div>`);

  let actions = '';
  if (confirmedMeal) {
    actions = `
      <div class="confirmed-banner">✅ <b>${esc(dateText)}</b> — কনফার্মড, আপনি এই দিনে খাবার পাবেন</div>
      <button class="btn btn-xl btn-danger ${locked ? 'locked' : ''}" data-act="cancel">
        ✖️ ${esc(dateText)} — খাবার বাতিল করুন</button>`;
  } else if (unconfirmedMeal) {
    actions = `<button class="btn btn-xl btn-warning ${locked ? 'locked' : ''}" data-act="order">
      🍽️ ${esc(dateText)} — কনফার্ম করুন</button>`;
  } else {
    actions = `<button class="btn btn-xl btn-success ${locked ? 'locked' : ''}" data-act="order">
      🍽️ ${esc(dateText)} — খাবার খেতে চাই</button>`;
  }

  const myOrders = myOrdersFor(u.id);
  const unconfirmed = myUnconfirmedFor(u.id);
  const todayConfirmed = myOrders.find(o => o.date === today);

  let heroFinalHTML;
  if (todayConfirmed) {
    heroFinalHTML = `<div class="today-highlight">
        <div class="th-content">
          <div class="th-label"><span class="ico">✅</span> আজ আপনার খাবার</div>
          <div class="th-num-wrap" style="margin:4px 0 6px">
            <span class="th-number" style="font-size:38px;letter-spacing:-1.5px">কনফার্মড</span>
          </div>
          <div class="th-sub">আপনি আজ খাবার নিচ্ছেন</div>
        </div>
      </div>`;
  } else {
    heroFinalHTML = `<div class="today-highlight">
        <div class="th-content">
          <div class="th-label"><span class="ico">🍽️</span> আজ আপনার খাবার</div>
          <div class="th-num-wrap" style="margin:4px 0 6px">
            <span class="th-number" style="font-size:38px;letter-spacing:-1.5px">অর্ডার হয়নি</span>
          </div>
          <div class="th-sub">আজ এখনো অর্ডার করেননি</div>
        </div>
      </div>`;
  }

  const unconfirmedHTML = unconfirmed.length ? `
    <div class="section-group tint-amber">
      <div class="section-label">⚠️ সম্পূর্ণ হয়নি এমন অর্ডার
        <span class="sl-count">${bnNum(unconfirmed.length)}টি</span>
      </div>
      <div class="card-block" style="background:linear-gradient(135deg,rgba(255,247,237,.85),rgba(255,237,213,.85));border:1.5px solid #fed7aa">
        <p class="hint" style="color:#9a3412">এই তারিখগুলোতে আপনার অর্ডার এখনো চূড়ান্ত হয়নি। তারিখে ক্লিক করে সম্পূর্ণ করুন।</p>
        ${unconfirmed.map(x => `
          <button class="btn btn-warning btn-block" data-jump="${x.date}" style="justify-content:flex-start">
            <span style="font-size:16px">⚠️</span>
            <span style="flex:1;text-align:left;font-weight:800">${esc(fmtShort(x.date))}</span>
            <span style="font-size:12.5px;opacity:.9">সম্পূর্ণ করুন →</span>
          </button>
        `).join('')}
      </div>
    </div>` : '';

  const myOrdersHTML = `
    <div class="section-group tint-green">
      <div class="section-label">📋 আমার অর্ডার সমূহ
        <span class="sl-count">${bnNum(myOrders.length)}টি</span>
      </div>
      <div class="card-block">
        ${myOrders.length ? `
          <p class="hint">🗑️ ডিলিট করতে চাইলে পাশের ডিলিট বাটনে ক্লিক করুন। আজকের অর্ডার cutoff সময়ের ভিতরেই ডিলিট করা যাবে।</p>
          <ul class="my-order-list">
            ${myOrders.map(o => {
              const isToday = o.date === today;
              const dt = new Date(o.date + 'T00:00:00');
              const wk = dt.toLocaleDateString('bn-BD', { weekday: 'short' });
              const dm = dt.toLocaleDateString('bn-BD', { day: 'numeric', month: 'short' });
              return `
                <li class="my-order-row ${isToday ? 'today' : ''}">
                  <div class="mo-info">
                    <b>${wk}, ${dm}${isToday ? ' (আজ)' : ''}</b>
                    <small>অর্ডার করা হয়েছে${o.served ? ' · ✅ খাবার নেওয়া হয়েছে' : ''}</small>
                  </div>
                  <div class="mo-actions">
                    <span class="pill ok">✓</span>
                    <button class="btn-del-order ${o.canDelete ? '' : 'locked'}"
                            data-del-order="${o.id}"
                            title="${o.canDelete ? 'অর্ডার ডিলিট করুন' : 'cutoff সময় শেষ হয়ে গেছে'}">
                      ${o.canDelete ? '🗑️' : '🔒'}
                    </button>
                  </div>
                </li>`;
            }).join('')}
          </ul>
        ` : `<div style="padding:16px;border:1px dashed var(--border);border-radius:12px;
                      color:var(--muted);font-style:italic;text-align:center;font-size:13px">
            এখনো কোনো অর্ডার নেই
          </div>`}
      </div>
    </div>`;

  const dateUnconfirmedHTML = unconfirmedMeal ? `
    <div class="section-group tint-amber">
      <div class="section-label">⚠️ সম্পূর্ণ হয়নি</div>
      <div class="unconfirmed-card">
        <div class="uc-icon">⚠️</div>
        <div class="uc-title">এই তারিখের অর্ডার সম্পূর্ণ হয়নি</div>
        <div class="uc-date">📅 ${esc(fmtShort(date))}</div>
        <div class="uc-hint">আপনি এই তারিখে খাবার চেয়েছিলেন কিন্তু এখনো নিশ্চিত করেননি।</div>
        <div class="uc-actions">
          <button class="btn btn-success btn-block" id="ucConfirmBtn" style="min-height:54px;font-size:15.5px">
            ✅ হ্যাঁ, খাবার চাই
          </button>
          <button class="btn btn-ghost danger btn-block" id="ucCancelBtn" style="min-height:48px">
            ✖️ না, বাতিল করুন
          </button>
        </div>
      </div>
    </div>` : '';

  v.innerHTML = `
    ${heroFinalHTML}
    ${unconfirmedHTML}
    ${dateUnconfirmedHTML}

    <div class="section-group tint-slate">
      <div class="section-label">📅 অর্ডার তারিখ বাছাই</div>
      <div class="card-block">
        <div class="card-head">
          <div class="ic blue">📅</div>
          <div>তারিখ নির্বাচন করুন</div>
        </div>
        <p class="hint">সর্বোচ্চ ${bnNum(MAX_ADVANCE_DAYS)} দিন আগাম অর্ডার করা যাবে।</p>
        <input type="date" id="datePick" value="${date}" min="${today}" max="${maxDate}">
      </div>

      <div class="hero-card">
        <div class="hero-date">${fmtDate(date)}${date === today ? ' · আজ' : ''}</div>
        <div class="hero-title">🍽️ দুপুরের খাবার</div>
        ${statusBadge}
        ${cutoffBanner}
        <div class="hero-actions">${actions}</div>
      </div>
    </div>

    ${myOrdersHTML}`;

  $$('[data-del-order]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      if (btn.classList.contains('locked')) {
        return toast('⏰ মিল দেওয়ার সময়সীমা শেষ — এই অর্ডার ডিলিট করা যাবে না', false);
      }
      const mealId = Number(btn.dataset.delOrder);
      const m = db.meals.find(x => x.id === mealId && x.user_id === u.id);
      if (!m) return toast('অর্ডার পাওয়া যায়নি', false);
      if (isPastCutoffFor(m.date)) return toast('⏰ cutoff সময় শেষ', false);
      openConfirmModal({
        title: 'Delete Order?',
        message: 'আপনি কি এই অর্ডারটি ডিলিট করতে চান? এই কাজটি ফেরানো যাবে না।',
        dateLabel: fmtShort(m.date),
        danger: true,
        yesLabel: 'হ্যাঁ, ডিলিট',
        noLabel: 'বাতিল',
        onYes: async () => {
          db.meals = db.meals.filter(x => x.id !== mealId);
          await persist();
          toast('✅ অর্ডারটি ডিলিট করা হয়েছে', true);
          renderTeacher();
        }
      });
    };
  });

  $$('[data-jump]').forEach(b => b.onclick = () => {
    state.teacherDate = b.dataset.jump;
    renderTeacher();
  });

  const ucConfirm = $('#ucConfirmBtn');
  if (ucConfirm) ucConfirm.onclick = () => {
    if (isPastCutoffFor(date)) return toast(cutoffText);
    openConfirmModal({
      title: 'Confirm Order?',
      message: 'আপনি কি এই তারিখের জন্য খাবার চূড়ান্ত করতে চান?',
      dateLabel: dateText,
      onYes: async () => {
        const m = rawMealFor(u.id, date);
        if (m) m.confirmed = 1;
        await persist();
        toast(`✅ ${dateText} — খাবার কনফার্ম হয়েছে`, true);
        renderTeacher();
      }
    });
  };
  const ucCancel = $('#ucCancelBtn');
  if (ucCancel) ucCancel.onclick = () => {
    if (isPastCutoffFor(date)) return toast(cutoffText);
    openConfirmModal({
      title: 'Cancel Order?',
      message: 'আপনি কি এই তারিখের অর্ডারটি বাতিল করতে চান?',
      dateLabel: dateText, danger: true,
      onYes: async () => {
        db.meals = db.meals.filter(m => !(m.user_id === u.id && m.date === date && m.meal_type === 'lunch'));
        await persist();
        toast(`${dateText} — বাতিল হয়েছে`, true);
        renderTeacher();
      }
    });
  };

  $('#datePick').onchange = e => {
    const val = e.target.value;
    if (val > maxDate) {
      toast(`সর্বোচ্চ ${bnNum(MAX_ADVANCE_DAYS)} দিন আগাম`);
      e.target.value = state.teacherDate;
      return;
    }
    state.teacherDate = val;
    renderTeacher();
  };

  $$('[data-act]').forEach(btn => {
    btn.onclick = () => {
      if (btn.classList.contains('locked')) return toast(lockReason || 'এখন অর্ডার করা যাবে না');
      const act = btn.dataset.act;
      const me = currentUser();
      const d = state.teacherDate;
      const label = d > todayStr() ? fmtShort(d) : 'আজ';

      if (act === 'order') {
        if (!getDaySettings(d).enabled) return toast('এই দিনে দুপুরের খাবার বন্ধ');
        if (isPastCutoffFor(d)) return toast(cutoffText);
        if (d > maxAdvanceDate()) return toast(`সর্বোচ্চ ${bnNum(MAX_ADVANCE_DAYS)} দিন`);
        let m = rawMealFor(me.id, d);
        if (!m) {
          db.meals.push({
            id: db.nextIds.meals++, user_id: me.id, date: d, meal_type: 'lunch',
            confirmed: 0, served: 0, served_at: null, created_at: Date.now()
          });
          await persist();
          renderTeacher();
        }
        openConfirmModal({
          title: 'Confirm Order?',
          message: 'আপনি কি এই দিনের জন্য খাবার অর্ডার করতে চান?',
          dateLabel: label,
          onYes: async () => {
            const existing = rawMealFor(me.id, d);
            if (existing) existing.confirmed = 1;
            await persist();
            toast(`✅ ${label} — খাবার কনফার্ম হয়েছে`, true);
            renderTeacher();
          }
        });
      } else if (act === 'cancel') {
        if (isPastCutoffFor(d)) return toast(cutoffText);
        openConfirmModal({
          title: 'Cancel Order?',
          message: 'আপনি কি এই অর্ডারটি বাতিল করতে চান?',
          dateLabel: label, danger: true,
          onYes: async () => {
            db.meals = db.meals.filter(m => !(m.user_id === me.id && m.date === d && m.meal_type === 'lunch'));
            await persist();
            toast(`${label} — বাতিল হয়েছে`, true);
            renderTeacher();
          }
        });
      }
    };
  });
}

/* ============================================================
   MATRON
   ============================================================ */
function renderMatron() {
  const u = currentUser();
  const v = $('#view');
  const today = todayStr();
  const s = statsFor(today);
  const upcoming = upcomingDays(today, MAX_ADVANCE_DAYS);
  const totalUpcoming = upcoming.reduce((a, x) => a + x.count, 0);

  const myManagers = db.users.filter(x => x.role === 'mess_manager')
    .slice().sort((a, b) => (b.created_at || 0) - (a.created_at || 0));

  const highlight = todayHighlightHTML(s.total, s.served, {
    label: 'আজকের মিল', icon: '🍽️',
    sub: `আজ মোট ${bnNum(s.total)} জন খাবার নিচ্ছেন`,
    cta: 'বিস্তারিত দেখতে ক্লিক করুন'
  });

  v.innerHTML = `
    ${highlight}

    <div class="stat-grid">
      <div class="stat-card primary clickable" data-stat="today">
        <div class="stat-ic">🍽️</div>
        <div class="stat-num">${bnNum(s.total)}</div>
        <div class="stat-label">আজকের মিল</div>
      </div>
      <div class="stat-card green clickable" data-stat="served">
        <div class="stat-ic">✅</div>
        <div class="stat-num">${bnNum(s.served)}</div>
        <div class="stat-label">খাবার নিয়েছে</div>
      </div>
      <div class="stat-card red clickable" data-stat="unserved">
        <div class="stat-ic">❌</div>
        <div class="stat-num">${bnNum(s.remaining)}</div>
        <div class="stat-label">খাবার নেয়নি</div>
      </div>
      <div class="stat-card clickable" data-stat="upcoming">
        <div class="stat-ic">📅</div>
        <div class="stat-num" style="color:var(--primary)">${bnNum(totalUpcoming)}</div>
        <div class="stat-label">আগামী ${bnNum(MAX_ADVANCE_DAYS)} দিনের</div>
      </div>
    </div>

    ${upcomingSingleCardHTML(upcoming)}

    <div class="section-group tint-blue">
      <div class="section-label">📊 রিপোর্ট</div>
      <div class="card-block">
        <div class="card-head">
          <div class="ic blue">📊</div>
          <div style="flex:1">মিল রিপোর্ট দেখুন</div>
        </div>
        <p class="hint" style="color:#4338ca;opacity:.9">
          তারিখ রেঞ্জ বাছাই করে দেখুন — কোন দিন কত মিল হয়েছে।
        </p>
        <button class="btn btn-primary btn-block" id="viewReport">📊 রিপোর্ট দেখুন</button>
      </div>
    </div>

    <div class="section-group tint-pink">
      <div class="section-label">➕ Mess Manager অ্যাকাউন্ট</div>

      <div class="card-block">
        <div class="card-head">
          <div class="ic pink">➕</div>
          <div>নতুন Mess Manager তৈরি করুন</div>
        </div>
        <p class="hint">সরাসরি তৈরি করুন — সুপার এডমিন অ্যাপ্রুভাল ছাড়াই সক্রিয় হবে।</p>
        <div class="grid-2">
          <label>নাম<input id="mmName" placeholder="পূর্ণ নাম"></label>
          <label>মোবাইল নম্বর *<input id="mmPhone" type="tel" placeholder="01XXXXXXXXX" maxlength="11"></label>
          <label>ইমেইল<input id="mmEmail" type="email" placeholder="user@example.com"></label>
          <label>পাসওয়ার্ড<input id="mmPass" type="password" minlength="6" placeholder="কমপক্ষে ৬ অক্ষর"></label>
        </div>
        <button class="btn btn-primary btn-block" id="createManager">➕ Mess Manager তৈরি করুন</button>
        <div class="msg" id="mmMsg"></div>
      </div>

      <div class="card-block">
        <div class="card-head">
          <div class="ic pink">🔗</div>
          <div>Invite লিংক তৈরি করুন</div>
        </div>
        <p class="hint">লিংক তৈরি করলে সাথে সাথে কপি করুন এবং যাকে Mess Manager বানাতে চান তাকে পাঠান।</p>
        <button class="btn btn-primary btn-block" id="genInvite">🔗 নতুন ইনভাইট লিংক তৈরি করুন</button>
        <div id="linkBox" class="link-box" style="display:none">
          <input id="linkInput" readonly>
          <button class="btn btn-success" id="copyBtn" data-copy-text="" style="min-width:auto">
            📋 কপি করুন
          </button>
        </div>
        <div class="msg" id="invMsg"></div>
      </div>

      <div class="card-block">
        <div class="card-head">
          <div class="ic">👥</div>
          <div>Mess Manager তালিকা (${bnNum(myManagers.length)})</div>
        </div>
        <p class="hint">🔘 টগল দিয়ে যেকোনো Mess Manager কে সক্রিয়/নিষ্ক্রিয় করুন।</p>
        <div class="user-admin-list">
          ${myManagers.length ? myManagers.map(x => `
            <div class="user-admin-row" data-uid="${x.id}">
              <div class="ua-left">
                <div class="ua-avatar">${roleIcon(x.role)}</div>
                <div class="ua-info">
                  <div class="ua-name">${esc(x.name)}</div>
                  <div class="ua-role">${esc(roleLabel(x.role))}</div>
                  <div class="ua-phone">${phoneHTML(x.phone)}</div>
                  <div class="ua-email">📧 ${esc(x.email)}</div>
                  ${creatorBadgeHTML(x)}
                </div>
              </div>
              <div class="ua-actions">
                <div class="ua-toggle-wrap">
                  <label class="toggle-switch">
                    <input type="checkbox" class="mm-toggle" data-id="${x.id}" ${x.active ? 'checked' : ''}>
                    <span class="toggle-slider"></span>
                  </label>
                  <span class="ua-toggle-label ${x.active ? 'on' : 'off'}">${x.active ? 'চালু' : 'বন্ধ'}</span>
                </div>
              </div>
            </div>`).join('') : '<div style="text-align:center;color:var(--muted);font-style:italic;padding:20px">এখনো কোনো Mess Manager তৈরি হয়নি</div>'}
        </div>
      </div>
    </div>`;

  const showForMatron = (kind) => {
    if (kind === 'today') {
      openListModal('আজকের মিলের তালিকা', `${bnNum(s.total)} জন খাবার নিচ্ছেন`, s.list, 'আজ কেউ খাবার নেয়নি।');
    } else if (kind === 'served') {
      const list = s.list.filter(x => x.served);
      openListModal('খাবার নিয়েছেন', `${bnNum(list.length)} জন খাবার নিয়েছেন`, list, 'এখনো কেউ খাবার নেয়নি।');
    } else if (kind === 'unserved') {
      const list = s.list.filter(x => !x.served);
      openListModal('খাবার নেয়নি', `${bnNum(list.length)} জন এখনো খাবার নেয়নি`, list.map(x => ({...x, served: false})), 'সবাই খাবার নিয়েছেন।');
    } else if (kind === 'upcoming') {
      openUpcomingDaysModal(`আগামী ${bnNum(MAX_ADVANCE_DAYS)} দিনের রিকোয়েস্ট`, upcoming);
    }
  };
  const hEl = $('[data-highlight-click]');
  if (hEl) hEl.onclick = () => showForMatron('today');
  $$('[data-stat]').forEach(c => c.onclick = () => showForMatron(c.dataset.stat));
  $('#viewReport').onclick = () => openReportModal();
  const uc = $('#upcomingCard');
  if (uc) uc.onclick = () => openUpcomingDaysModal(
    `আগামী ${bnNum(MAX_ADVANCE_DAYS)} দিনের রিকোয়েস্ট`, upcoming);

  $$('.mm-toggle').forEach(t => {
    t.onchange = async () => {
      const id = Number(t.dataset.id);
      const mgr = db.users.find(x => x.id === id);
      if (!mgr) return;
      mgr.active = t.checked ? 1 : 0;
      await persist();
      const wrap = t.closest('.ua-toggle-wrap');
      const label = wrap.querySelector('.ua-toggle-label');
      label.textContent = mgr.active ? 'চালু' : 'বন্ধ';
      label.classList.toggle('on', !!mgr.active);
      label.classList.toggle('off', !mgr.active);
      toast(mgr.active ? `${mgr.name} — অ্যাক্সেস চালু` : `${mgr.name} — অ্যাক্সেস বন্ধ`, !!mgr.active);
    };
  });

  $('#createManager').onclick = async () => {
    const name = $('#mmName').value.trim();
    const phone = $('#mmPhone').value.trim();
    const email = $('#mmEmail').value.toLowerCase().trim();
    const pass = $('#mmPass').value;
    if (!name || !phone || !email || !pass) return setMsg('mmMsg', 'সব তথ্য দিন');
    if (!isValidPhone(phone)) return setMsg('mmMsg', 'সঠিক ১১ ডিজিটের মোবাইল নম্বর দিন');
    if (pass.length < 6) return setMsg('mmMsg', 'পাসওয়ার্ড কমপক্ষে ৬ অক্ষর');
    if (db.users.find(x => x.email === email)) return setMsg('mmMsg', 'এই ইমেইল আগে থেকেই আছে');
    if (db.users.find(x => x.phone === phone)) return setMsg('mmMsg', 'এই মোবাইল নম্বর আগে থেকেই আছে');
    const now = Date.now();
    db.users.push({
      id: db.nextIds.users++, name, email, phone,
      password: hashPassword(pass), role: 'mess_manager',
      active: 1, created_at: now,
      created_by: u.id, created_by_name: u.name, created_by_role: u.role,
      approved_at: now, approved_by: 'matron',

        </div>
      </div>
      <span class="check-tag">${isServed ? 'খাবার নিয়েছে' : 'খাবার নেয়নি'}</span>
    </li>`;
}

function wireManagerEvents() {
  const date = state.managerDate;
  const today = todayStr();
  const maxDate = maxAdvanceDate();
  const isToday = date === today;

  $('#mgrDate').onchange = e => {
    const val = e.target.value;
    if (!val) return;
    if (val > maxDate) { toast(`সর্বোচ্চ ${bnNum(MAX_ADVANCE_DAYS)} দিন`); e.target.value = state.managerDate; return; }
    state.managerDate = val;
    renderManager();
  };
  $('#prevDay').onclick = () => shiftDay(-1);
  $('#nextDay').onclick = () => shiftDay(1);
  const backBtn = $('#backToday');
  if (backBtn) backBtn.onclick = () => { state.managerDate = todayStr(); renderManager(); };
  $$('[data-filter]').forEach(b => {
    b.onclick = () => { state.managerFilter = b.dataset.filter; renderManager(); };
  });
  $('#exportCsv').onclick = () => downloadCSV(date);

  if (!isToday) return;

  $$('[data-serve]').forEach(li => {
    if (!li.dataset.serve) return;
    li.onclick = async (e) => {
      if (e.target.closest('.phone-action')) return;
      const uid = Number(li.dataset.serve);
      const m = db.meals.find(x => x.user_id === uid && x.date === date && x.meal_type === 'lunch' && x.confirmed === 1);
      if (!m) return toast('এই ইউজারের কোনো মিল নেই');
      m.served = m.served ? 0 : 1;
      m.served_at = m.served ? Date.now() : null;
      await persist();
      renderManager();
    };
  });
}
function shiftDay(delta) {
  const next = addDays(state.managerDate, delta);
  if (next > maxAdvanceDate()) return toast(`সর্বোচ্চ ${bnNum(MAX_ADVANCE_DAYS)} দিন`);
  state.managerDate = next;
  renderManager();
}
document.addEventListener('keydown', e => {
  if (state.modal) { if (e.key === 'Escape') closeModal(); return; }
  const u = currentUser();
  if (!u || u.role !== 'mess_manager') return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') {
    if (e.key === 'Escape') e.target.blur();
    return;
  }
  if (e.key === 'ArrowLeft')  { e.preventDefault(); shiftDay(-1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); shiftDay(1); }
  else if (e.key === 't' || e.key === 'T') { state.managerDate = todayStr(); renderManager(); }
});

function downloadCSV(date) {
  const s = statsFor(date);
  const escape = v => {
    const str = v == null ? '' : String(v);
    return /[",\n]/.test(str) ? `"${str.replace(/"/g, '""')}"` : str;
  };
  const fmtTime = ts => ts ? new Date(ts).toLocaleString('bn-BD') : '';
  const header = ['#', 'Name', 'Phone', 'Role', 'Served', 'Served At', 'Requested At'];
  const lines = [header.join(',')];
  s.list.forEach((r, i) => {
    lines.push([i + 1, escape(r.name), escape(r.phone), r.role,
      r.served ? 'Yes' : 'No',
      escape(fmtTime(r.served_at)), escape(fmtTime(r.created_at))].join(','));
  });
  const csv = '\uFEFF' + lines.join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `mgmc-meals-${date}.csv`;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
  toast('CSV ডাউনলোড শুরু হয়েছে', true);
}

          <label style="flex-direction:row;align-items:center;gap:10px;padding:12px;border:1.5px solid var(--border);border-radius:12px;background:#fff">
            <input type="checkbox" id="ds_enabled" style="width:20px;height:20px">
            <span style="color:var(--text)">এই দিনে খাবার চালু</span>
          </label>
        </div>
        <div class="row">
          <button class="btn btn-primary" id="ds_save" style="flex:1">💾 সেভ</button>
          <button class="btn btn-ghost danger" id="ds_remove" style="flex:1">🗑️ Override মুছুন</button>
        </div>
        <div class="msg" id="dsMsg"></div>
        <h4 style="margin-top:8px">📌 বর্তমান Overrides</h4>
        <ul class="list" id="dsList"><li class="empty">লোড হচ্ছে…</li></ul>
      </div>
    </div>

    <div class="section-group tint-pink">
      <div class="section-label">👥 ইউজার ম্যানেজমেন্ট
        <span class="sl-count">${bnNum(users.length)} জন</span>
      </div>

      <div class="card-block">
        <p class="hint">🔘 টগল দিয়ে চালু/বন্ধ করুন · ✏️ এডিট করুন</p>
        <div class="user-admin-list">
          ${users.map(x => `
            <div class="user-admin-row" data-uid="${x.id}">
              <div class="ua-left">
                <div class="ua-avatar">${roleIcon(x.role)}</div>
                <div class="ua-info">
                  <div class="ua-name">
                    ${esc(x.name)}
                    ${x.id === u.id ? '<span class="ua-self">আপনি</span>' : ''}
                  </div>
                  <div class="ua-role">${esc(roleLabel(x.role))}</div>
                  <div class="ua-phone">${phoneHTML(x.phone)}</div>
                  <div class="ua-email">📧 ${esc(x.email)}</div>
                  ${creatorBadgeHTML(x)}
                </div>
              </div>
              <div class="ua-actions">
                <div class="ua-toggle-wrap">
                  <label class="toggle-switch">
                    <input type="checkbox" class="ua-toggle" data-id="${x.id}" ${x.active ? 'checked' : ''}>
                    <span class="toggle-slider"></span>
                  </label>
                  <span class="ua-toggle-label ${x.active ? 'on' : 'off'}">${x.active ? 'চালু' : 'বন্ধ'}</span>
                </div>
                <button class="btn btn-ghost btn-sm" data-edit="${x.id}">✏️ এডিট</button>
                <button class="btn btn-ghost danger btn-sm" data-del="${x.id}">🗑️</button>
              </div>
            </div>`).join('')}
        </div>
      </div>
    </div>`;

  const showForAdmin = (kind) => {
    if (kind === 'today') {
      openListModal('আজকের মিল', `${bnNum(s.total)} জন খাবার নিচ্ছেন`, s.list, 'আজ কেউ খাবার নেয়নি।');
    } else if (kind === 'unserved') {
      const list = s.list.filter(x => !x.served);
      openListModal('খাবার নেয়নি', `${bnNum(list.length)} জন এখনো খাবার নেয়নি`, list.map(x => ({...x, served: false})), 'সবাই খাবার নিয়েছেন।');
    } else if (kind === 'users') {
      const el = document.querySelector('.user-admin-list');
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    } else if (kind === 'reset') {
      openAdminResetModal();
    }
  };
  const hEl = $('[data-highlight-click]');
  if (hEl) hEl.onclick = () => showForAdmin('today');
  $$('[data-stat]').forEach(c => c.onclick = () => showForAdmin(c.dataset.stat));
  $('#viewReport').onclick = () => openReportModal();
  const uc = $('#upcomingCard');
  if (uc) uc.onclick = () => openUpcomingDaysModal(
    `আগামী ${bnNum(MAX_ADVANCE_DAYS)} দিনের রিকোয়েস্ট`, upcoming);

  $('#saveSettings').onclick = async () => {
    db.settings.app_name = $('#s_app_name').value;
    db.settings.mess_name = $('#s_mess_name').value;
    db.settings.cutoff_time = $('#s_cutoff_time').value;
    db.settings.meal_capacity = $('#s_meal_capacity').value;
    db.settings.meal_price = $('#s_meal_price').value;
    db.settings.lunch_enabled = $('#s_lunch_enabled').checked ? '1' : '0';
    await persist();
    setMsg('sMsg', 'সেটিংস সেভ হয়েছে ✅', true);
    const titleEl = document.querySelector('.app-title');
    if (titleEl) titleEl.textContent = db.settings.app_name;
  };

  $('#addUser').onclick = async () => {
    const name = $('#nName').value.trim();
    const phone = $('#nPhone').value.trim();
    const email = $('#nEmail').value.toLowerCase().trim();
    const pass = $('#nPass').value;
    const role = $('#nRole').value;
    if (!name || !email || !pass || !phone) return setMsg('addMsg', 'সব তথ্য দিন');
    if (!isValidPhone(phone)) return setMsg('addMsg', 'সঠিক ১১ ডিজিটের মোবাইল নম্বর দিন');
    if (pass.length < 6) return setMsg('addMsg', 'পাসওয়ার্ড কমপক্ষে ৬ অক্ষর');
    if (db.users.find(x => x.email === email)) return setMsg('addMsg', 'এই ইমেইল আগে থেকেই আছে');
    if (db.users.find(x => x.phone === phone)) return setMsg('addMsg', 'এই মোবাইল নম্বর আগে থেকেই আছে');
    const now = Date.now();
    db.users.push({
      id: db.nextIds.users++, name, email, phone,
      password: hashPassword(pass), role, active: 1,
      created_at: now,
      created_by: u.id, created_by_name: u.name, created_by_role: 'superadmin',
      approved_at: now, approved_by: 'superadmin',
      approval_note: 'সুপার এডমিন কর্তৃক সরাসরি তৈরি'
    });
    await persist();
    toast('ইউজার যোগ হয়েছে ✅', true);
    renderAdmin();
  };

  $$('[data-approve]').forEach(b => b.onclick = async () => {
    const usr = db.users.find(x => x.id === Number(b.dataset.approve));
    if (usr) {
      usr.active = 1;
      usr.approved_at = Date.now();
      usr.approved_by = 'superadmin';
      usr.approval_note = `সুপার এডমিন ${u.name} কর্তৃক অনুমোদিত`;
      await persist(); renderAdmin();
    }
  });
  $$('[data-reject]').forEach(b => b.onclick = async () => {
    if (!confirm('এই রেজিস্ট্রেশন বাতিল করবেন?')) return;
    const id = Number(b.dataset.reject);
    db.users = db.users.filter(x => x.id !== id);
    await persist(); renderAdmin();
  });

  $$('.ua-toggle').forEach(t => {
    t.onchange = async () => {
      const id = Number(t.dataset.id);
      const usr = db.users.find(x => x.id === id);
      if (!usr) return;
      if (usr.id === u.id && !t.checked) {
        t.checked = true;
        return toast('নিজের অ্যাকাউন্ট বন্ধ করা যাবে না');
      }
      if (usr.role === 'superadmin' && !t.checked) {
        const cnt = db.users.filter(x => x.role === 'superadmin' && x.active).length;
        if (cnt <= 1) {
          t.checked = true;
          return toast('শেষ সুপার এডমিন নিষ্ক্রিয় করা যাবে না');
        }
      }
      usr.active = t.checked ? 1 : 0;
      await persist();
      const wrap = t.closest('.ua-toggle-wrap');
      const label = wrap.querySelector('.ua-toggle-label');
      label.textContent = usr.active ? 'চালু' : 'বন্ধ';
      label.classList.toggle('on', !!usr.active);
      label.classList.toggle('off', !usr.active);
      toast(usr.active ? `${usr.name} — অ্যাক্সেস চালু` : `${usr.name} — অ্যাক্সেস বন্ধ`, !!usr.active);
    };
  });

  $$('[data-edit]').forEach(b => b.onclick = () => openUserEditModal(Number(b.dataset.edit)));

  $$('[data-del]').forEach(b => b.onclick = async () => {
    const id = Number(b.dataset.del);
    if (id === u.id) return toast('নিজেকে মুছবেন না');
    const usr = db.users.find(x => x.id === id);
    if (!usr) return;
    if (usr.role === 'superadmin' && db.users.filter(x => x.role === 'superadmin').length <= 1)
      return toast('শেষ সুপার এডমিন মুছবেন না');
    if (!confirm(`"${usr.name}" কে মুছে ফেলবেন?`)) return;
    db.users = db.users.filter(x => x.id !== id);
    db.meals = db.meals.filter(m => m.user_id !== id);
    await persist(); renderAdmin();
  });

  const dateEl = $('#ds_date');
  const cutEl = $('#ds_cutoff');
  const enEl = $('#ds_enabled');
  dateEl.value = todayStr();

  function loadOne() {
    const s = getDaySettings(dateEl.value);
    cutEl.value = s.cutoff;
    enEl.checked = s.enabled;
  }
  function loadList() {
    const listEl = $('#dsList');
    const upcomingList = Object.entries(db.day_settings)
      .filter(([d]) => d >= todayStr())
      .sort(([a], [b]) => a.localeCompare(b))
      .slice(0, 10);
    listEl.innerHTML = upcomingList.length
      ? upcomingList.map(([d, r]) => `
          <li><div><b>${fmtDate(d)}</b>
            <small>Cutoff: ${esc(r.cutoff_time || '—')} · খাবার: ${r.lunch_enabled === 0 ? 'বন্ধ' : 'চালু'}</small>
          </div></li>`).join('')
      : '<li class="empty">কোনো override নেই</li>';
  }
  loadOne(); loadList();
  dateEl.onchange = loadOne;

  $('#ds_save').onclick = async () => {
    if (!dateEl.value) return setMsg('dsMsg', 'তারিখ দিন');
    db.day_settings[dateEl.value] = {
      cutoff_time: cutEl.value || null,
      lunch_enabled: enEl.checked ? 1 : 0
    };
    await persist();
    setMsg('dsMsg', 'সেভ হয়েছে ✅', true);
    loadList();
  };
  $('#ds_remove').onclick = async () => {
    if (!db.day_settings[dateEl.value]) return setMsg('dsMsg', 'এই দিনে কোনো override নেই');
    delete db.day_settings[dateEl.value];
    await persist();
    setMsg('dsMsg', 'Override মুছে ফেলা হয়েছে', true);
    loadOne(); loadList();
  };
}

window.addEventListener('hashchange', () => {
  if (!currentUser()) renderAuth();
});

/* ============================================================
   BOOT
   ============================================================ */
loadDatabase();
</script>
</body>
</html>
